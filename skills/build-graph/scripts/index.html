<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Docs Graph</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: #f7f7f4;
    color: #2a2a35;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
    overflow: hidden;
    height: 100vh;
  }

  #header {
    position: fixed;
    top: 0; left: 0; right: 0;
    z-index: 10;
    padding: 18px 28px 6px;
    background: #f7f7f4;
    pointer-events: none;
    display: flex;
    align-items: baseline;
    gap: 16px;
  }

  #header h1 {
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.12em;
    color: #6a6a78;
    text-transform: uppercase;
    pointer-events: auto;
  }

  /* ── Top strip: always-on reference material (guides/refs/data) ──
     Solid background with a soft bottom shadow so it reads as a contained
     region — the SVG scrolls cleanly under, its content stays hidden
     until it exits the strip zone. */
  #guide-strip {
    position: fixed;
    top: 40px;
    left: 0; right: 0;
    z-index: 10;
    padding: 2px 28px 10px;
    background: #f7f7f4;
    box-shadow: 0 8px 12px -8px rgba(40, 40, 60, 0.08);
    display: flex;
    flex-direction: column;
    gap: 5px;
    pointer-events: none;
  }
  .strip-row {
    display: flex;
    align-items: center;
    gap: 8px;
    flex-wrap: wrap;
  }
  .strip-label {
    font-size: 10px;
    font-weight: 600;
    letter-spacing: 0.12em;
    color: #9a9aa8;
    text-transform: uppercase;
    margin-right: 6px;
    min-width: 44px;
    pointer-events: auto;
  }
  /* Stats footer inside the strip — sits below the data row, showing the
     timeline-visible type breakdown (docs / reviews / charts). */
  .strip-stats {
    display: flex;
    align-items: center;
    gap: 4px;
    flex-wrap: wrap;
    padding-top: 6px;
    margin-top: 2px;
    border-top: 1px solid #eee8d8;
    font-size: 12px;
    color: #6a6a78;
    pointer-events: auto;
  }
  .strip-stats-item {
    display: inline-flex;
    align-items: center;
    gap: 6px;
  }
  .strip-stats-icon {
    font-size: 13px;
    line-height: 1;
    font-weight: 600;
    width: 14px;
    text-align: center;
  }
  .strip-stats-sep {
    color: #c8c8d0;
    margin: 0 6px;
  }
  .strip-pill {
    display: inline-flex;
    align-items: center;
    gap: 7px;
    padding: 5px 13px 5px 11px;
    background: #ffffff;
    border: 1px solid #e4e4dc;
    border-radius: 999px;
    color: #3a3a48;
    font-size: 12px;
    font-weight: 500;
    cursor: pointer;
    transition: background 0.12s, border-color 0.12s, transform 0.08s;
    pointer-events: auto;
    font-family: inherit;
    line-height: 1.2;
  }
  .strip-pill:active { transform: translateY(1px); }
  .strip-pill .icon { font-size: 13px; line-height: 1; }
  /* Guide variant — dust rose */
  .strip-pill.guide { border-color: #ecdce5; color: #6a3a55; }
  .strip-pill.guide:hover { background: #faf0f5; border-color: #B04878; }
  .strip-pill.guide .icon { color: #B04878; }
  /* Reference variant — bronze (canonical domain context) */
  .strip-pill.ref { border-color: #e8dcc0; color: #6a5330; }
  .strip-pill.ref:hover { background: #f7f0e0; border-color: #8A6D3B; }
  .strip-pill.ref .icon { color: #8A6D3B; font-weight: 700; }
  /* Data variant — terracotta (matches research node color) */
  .strip-pill.data { border-color: #f0d4c8; color: #8a3a25; }
  .strip-pill.data:hover { background: #fbf1ec; border-color: #E05D44; }
  .strip-pill.data .icon { color: #E05D44; }

  #tooltip {
    position: fixed;
    z-index: 20;
    background: #ffffff;
    border: 1px solid #e0e0d8;
    border-radius: 10px;
    padding: 14px 18px;
    max-width: 320px;
    pointer-events: none;
    opacity: 0;
    transition: opacity 0.12s;
    font-size: 13px;
    line-height: 1.5;
    box-shadow: 0 8px 32px rgba(40, 40, 60, 0.12);
  }

  #tooltip .tt-name {
    font-weight: 600;
    font-size: 13px;
    margin-bottom: 3px;
    color: #1a1a25;
  }

  #tooltip .tt-type {
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    margin-bottom: 8px;
    font-weight: 600;
  }

  #tooltip .tt-desc {
    color: #5a5a68;
    font-size: 12px;
    line-height: 1.5;
  }

  #tooltip .tt-path {
    color: #9a9aa8;
    font-size: 10px;
    margin-top: 8px;
    font-family: 'SF Mono', 'Fira Code', 'Consolas', monospace;
  }

  #tooltip .tt-hint {
    color: #b0b0b8;
    font-size: 10px;
    margin-top: 6px;
    font-style: italic;
  }

  svg { display: block; }

  /* Focus mode — applied to <g.node> and <path.link> via classes */
  .dimmed { opacity: 0.12; transition: opacity 0.18s; }
  .focused { opacity: 1; transition: opacity 0.18s; }
  .node-clickable { cursor: pointer; }

  /* ── Side panel ── */
  #panel {
    position: fixed;
    top: 0;
    right: 0;
    bottom: 0;
    width: 70vw;
    max-width: 1100px;
    background: #ffffff;
    border-left: 1px solid #e6e6dc;
    box-shadow: -16px 0 48px rgba(40, 40, 60, 0.06);
    z-index: 30;
    transform: translateX(100%);
    transition: transform 0.28s cubic-bezier(.4, 0, .2, 1);
    display: flex;
    flex-direction: column;
  }
  #panel.open { transform: translateX(0); }
  #panel-backdrop {
    position: fixed; inset: 0; background: rgba(20,20,30,0.18);
    opacity: 0; pointer-events: none; transition: opacity 0.2s; z-index: 29;
  }
  #panel-backdrop.open { opacity: 1; pointer-events: auto; }

  #panel-header {
    padding: 24px 32px 18px;
    border-bottom: 1px solid #f0f0e8;
    flex-shrink: 0;
  }
  #panel-close, #panel-refresh {
    position: absolute;
    top: 18px;
    width: 32px;
    height: 32px;
    border: none;
    background: transparent;
    color: #9a9aa8;
    font-size: 22px;
    cursor: pointer;
    border-radius: 6px;
    line-height: 1;
    transition: background 0.12s;
  }
  #panel-close { right: 22px; }
  #panel-refresh { right: 56px; }
  #panel-close:hover, #panel-refresh:hover { background: #f0f0e8; color: #2a2a35; }

  #panel-type {
    display: inline-block;
    font-size: 10px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    padding: 4px 10px;
    border-radius: 4px;
    margin-bottom: 10px;
  }
  #panel-name {
    font-size: 22px;
    font-weight: 700;
    color: #1a1a25;
    line-height: 1.25;
    margin-bottom: 8px;
    padding-right: 40px;
  }
  #panel-meta {
    font-size: 12px;
    color: #9a9aa8;
    font-family: 'SF Mono', 'Fira Code', monospace;
  }
  #panel-meta a {
    color: #6a6a78;
    text-decoration: none;
    border-bottom: 1px dotted #c4c4ba;
  }
  #panel-meta a:hover { color: #2a2a35; }

  #panel-body {
    padding: 24px 32px 48px;
    overflow-y: auto;
    flex: 1;
    font-size: 14px;
    line-height: 1.65;
    color: #2a2a35;
  }
  #panel-body h1, #panel-body h2, #panel-body h3, #panel-body h4 {
    color: #1a1a25;
    font-weight: 700;
    margin-top: 1.4em;
    margin-bottom: 0.5em;
    line-height: 1.3;
  }
  #panel-body h1 { font-size: 22px; margin-top: 0; }
  #panel-body h2 { font-size: 17px; }
  #panel-body h3 { font-size: 14px; text-transform: uppercase; letter-spacing: 0.04em; color: #5a5a68; }
  #panel-body p { margin-bottom: 0.9em; }
  #panel-body ul, #panel-body ol { margin: 0 0 1em 1.4em; }
  #panel-body li { margin-bottom: 0.3em; }
  #panel-body strong { color: #1a1a25; font-weight: 600; }
  #panel-body em { color: #5a5a68; }
  #panel-body code {
    background: #f4f4ec;
    padding: 1px 6px;
    border-radius: 4px;
    font-size: 12px;
    font-family: 'SF Mono', 'Fira Code', monospace;
  }
  #panel-body pre {
    background: #f4f4ec;
    padding: 14px 18px;
    border-radius: 8px;
    overflow-x: auto;
    margin: 1em 0;
  }
  #panel-body pre code { background: transparent; padding: 0; }
  #panel-body hr { border: none; border-top: 1px solid #f0f0e8; margin: 1.6em 0; }
  #panel-body blockquote {
    border-left: 3px solid #e0e0d8;
    padding-left: 16px;
    color: #5a5a68;
    margin: 1em 0;
  }
  #panel-body a { color: #3F6FD9; text-decoration: none; border-bottom: 1px solid #c8d4f0; }
  #panel-body a:hover { border-bottom-color: #3F6FD9; }

  /* Tables */
  #panel-body table {
    width: 100%;
    border-collapse: collapse;
    margin: 1em 0 1.4em;
    font-size: 13px;
    line-height: 1.5;
  }
  #panel-body thead th {
    text-align: left;
    font-weight: 600;
    color: #1a1a25;
    padding: 8px 12px;
    border-bottom: 2px solid #d8d8ce;
    background: #fafaf6;
    white-space: nowrap;
  }
  #panel-body tbody td {
    padding: 7px 12px;
    border-bottom: 1px solid #eeeeea;
    vertical-align: top;
    color: #2a2a35;
  }
  #panel-body tbody tr:hover { background: #f8f8f4; }
  #panel-body tbody td:first-child { font-weight: 600; white-space: nowrap; }

  /* Checkbox lists (task lists) */
  #panel-body ul li input[type="checkbox"] {
    margin-right: 6px;
    accent-color: #3F6FD9;
  }

  /* Improve readability for long prose */
  #panel-body p, #panel-body li { line-height: 1.65; }

  /* ── Full-screen chart overlay ── */
  #chart-overlay {
    position: fixed;
    inset: 0;
    z-index: 40;
    background: #ffffff;
    display: none;
    flex-direction: column;
  }
  #chart-overlay.open { display: flex; }
  #chart-overlay-header {
    display: flex;
    align-items: center;
    padding: 12px 20px;
    border-bottom: 1px solid #e6e6dc;
    flex-shrink: 0;
    background: #fafaf6;
  }
  #chart-overlay-type {
    display: inline-block;
    font-size: 10px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    padding: 4px 10px;
    border-radius: 4px;
    margin-right: 12px;
  }
  #chart-overlay-name {
    font-size: 16px;
    font-weight: 600;
    color: #2a2a35;
    flex: 1;
  }
  #chart-overlay-close {
    width: 36px;
    height: 36px;
    border: none;
    background: transparent;
    color: #9a9aa8;
    font-size: 24px;
    cursor: pointer;
    border-radius: 6px;
    line-height: 1;
    transition: background 0.12s;
    flex-shrink: 0;
  }
  #chart-overlay-close:hover, #chart-overlay-download:hover { background: #f0f0e8; color: #2a2a35; }
  #chart-overlay-download {
    width: 36px;
    height: 36px;
    border: none;
    background: transparent;
    color: #9a9aa8;
    font-size: 18px;
    cursor: pointer;
    border-radius: 6px;
    line-height: 1;
    transition: background 0.12s;
    flex-shrink: 0;
    margin-right: 4px;
  }
  #chart-iframe {
    flex: 1;
    border: none;
    width: 100%;
    background: #f4f4f0;
  }
</style>
</head>
<body>

<div id="header">
  <h1>Strategy Graph</h1>
</div>

<div id="guide-strip"></div>

<div id="tooltip"></div>

<div id="panel-backdrop"></div>
<aside id="panel">
  <button id="panel-refresh" aria-label="Refresh" title="Reload graph data">↻</button>
  <button id="panel-close" aria-label="Close">×</button>
  <div id="panel-header">
    <div id="panel-type"></div>
    <div id="panel-name"></div>
    <div id="panel-meta"></div>
  </div>
  <div id="panel-body"></div>
</aside>

<!-- Full-screen chart overlay -->
<div id="chart-overlay">
  <div id="chart-overlay-header">
    <div id="chart-overlay-type"></div>
    <div id="chart-overlay-name"></div>
    <button id="chart-overlay-download" aria-label="Download" title="Download as image">⤓</button>
    <button id="chart-overlay-close" aria-label="Close">×</button>
  </div>
  <iframe id="chart-iframe"></iframe>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.9.0/d3.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.0/marked.min.js"></script>
<script>

// ── Embedded Graph Data (auto-replaced by build.py) ─────
// __GRAPH_DATA_START__
const GRAPH_DATA = {"projects": {}, "nodes": [], "edges": []};
// __GRAPH_DATA_END__

// ── Config ──────────────────────────────────────────────

const TYPE_STYLES = {
  doc:        { color: '#3F6FD9', icon: '◆', label: 'Doc' },
  review:     { color: '#C77E25', icon: '❝', label: 'Review' },
  research:   { color: '#E05D44', icon: '⊞', label: 'Data' },
  chart:      { color: '#2A7B9B', icon: '▣', label: 'Chart' },
  guide:      { color: '#B04878', icon: '❖', label: 'Guide' },
  ref:        { color: '#8A6D3B', icon: '§', label: 'Reference' },
  external:   { color: '#8a8a98', icon: '◇', label: 'External' },  // hidden from graph, used in panel
};

const PROJECT_PALETTES = [
  { bg: '#ffffff', border: '#e6e6dc', label: '#7a7a88' },
];

function getTypeStyle(type) {
  return TYPE_STYLES[type] || TYPE_STYLES.doc;
}

// ── Render ───────────────────────────────────────────────

function init() {
  if (!GRAPH_DATA) {
    document.body.innerHTML = `
      <div style="display:flex;align-items:center;justify-content:center;height:100vh;color:#4a4a60;font-size:13px;">
        <div style="text-align:center">
          <p style="font-size:16px;margin-bottom:8px;color:#6a6a80">No graph data</p>
          <p>Run <code style="background:#16161e;padding:3px 10px;border-radius:6px;font-size:12px;">python build.py</code> to generate</p>
        </div>
      </div>`;
    return;
  }

  const { projects, nodes: allNodes, edges } = GRAPH_DATA;
  const width = window.innerWidth;
  const height = window.innerHeight;

  // ── Filter: only render local, primary-work docs in the timeline ──
  // Paradigm:
  //   - Guides (process / how-to)      → pinned in top strip
  //   - Refs (canonical domain context)→ pinned in top strip
  //   - Research nodes (data sources)  → pinned in top strip
  //   - Charts paired to a parent doc  → absorbed as a badge-button on the parent
  //   - Externals                      → badge count + Sources panel
  //   - Everything else                → rendered on the timeline
  const guideNodes = allNodes.filter(n => n.type === 'guide' && !n.external);
  const refNodes   = allNodes.filter(n => n.type === 'ref' && !n.external);
  const dataNodes  = allNodes.filter(n => n.type === 'research' && !n.external);

  // Pair each chart with a parent doc via bidirectional edges. A parent is
  // the first non-chart, non-research, non-guide, non-ref, non-external neighbor.
  const allById = new Map(allNodes.map(n => [n.id, n]));
  const chartByParent = {}; // parent_id -> chart node
  const pairedChartIds = new Set();
  allNodes.filter(n => n.type === 'chart' && !n.external).forEach(c => {
    for (const e of edges) {
      const otherId = e.source === c.id ? e.target : (e.target === c.id ? e.source : null);
      if (!otherId) continue;
      const other = allById.get(otherId);
      if (!other || other.external) continue;
      if (['chart','research','guide','ref'].includes(other.type)) continue;
      chartByParent[otherId] = c;
      pairedChartIds.add(c.id);
      break;
    }
  });

  const nodes = allNodes.filter(n =>
    !n.external &&
    n.type !== 'guide' &&
    n.type !== 'ref' &&
    n.type !== 'research' &&
    !pairedChartIds.has(n.id)
  );
  const extCount = allNodes.filter(n => n.external).length;

  // Build external ref counts per timeline node.
  // Edges to guides/research/externals are surfaced in the side panel
  // but never drawn on the timeline canvas.
  const nodeIds = new Set(nodes.map(n => n.id));
  const guideIds = new Set(guideNodes.map(n => n.id));
  const refIds = new Set(refNodes.map(n => n.id));
  const dataIds = new Set(dataNodes.map(n => n.id));
  const extRefCount = {};  // count of non-timeline refs (for the badge)
  const extRefsFor = {};   // full list of non-timeline edge targets per doc
  // Initialize for all non-external docs so guides/refs/data also have their
  // Sources populated when clicked.
  allNodes.forEach(n => {
    if (n.external) return;
    extRefCount[n.id] = 0;
    extRefsFor[n.id] = [];
  });
  for (const e of edges) {
    const isTimelineTarget = nodeIds.has(e.target);
    if (!isTimelineTarget && extRefCount[e.source] !== undefined) {
      // Guide / ref / data edges are implicit (shown in the top strip), so
      // only URL-style externals bump the badge count.
      if (!guideIds.has(e.target) && !refIds.has(e.target) && !dataIds.has(e.target)) {
        extRefCount[e.source]++;
      }
      extRefsFor[e.source].push(e.target);
    }
  }

  // Quick date lookup for within-day edge filter.
  const nodeDate = new Map(nodes.map(n => [n.id, n.date || '']));

  // ── Guide strip (populated after openPanel is defined, see below) ──
  const guideStripEl = document.getElementById('guide-strip');

  // ── Resolve edges: within-day, timeline-only ──
  // Cross-day edges are dropped entirely. They mostly create spaghetti
  // without carrying useful signal. Guide + data + external refs are
  // already handled via the top strip and the panel "Sources" section.
  const resolvedEdges = edges.filter(e => {
    if (!nodeIds.has(e.source) || !nodeIds.has(e.target)) return false;
    const sDate = nodeDate.get(e.source);
    const tDate = nodeDate.get(e.target);
    return sDate && tDate && sDate === tDate;
  });

  // ── Stats ──
  // Breakdown of timeline-visible types (docs, reviews, charts). Guides/refs/
  // data are already visible as pill rows in the strip, so we don't repeat
  // their counts here. Rendered as a footer row inside the strip, after the
  // data row — see after addStripRow calls below.
  const docCount = nodes.filter(n => n.type === 'doc').length;
  const reviewCount = nodes.filter(n => n.type === 'review').length;
  const chartTotal = allNodes.filter(n => n.type === 'chart' && !n.external).length;

  // ── SVG ──
  const svg = d3.select('body').append('svg').attr('width', width).attr('height', height);

  // Arrow markers — one per type color so arrowheads match edges.
  // Uses userSpaceOnUse so position doesn't drift when stroke-width changes
  // (e.g., hover highlight). refX is tuned so the tip lands just outside the
  // node circle (r=22) with a small visual gap.
  const defs = svg.append('defs');
  const allColors = new Set(['#b8b8b0']); // default
  nodes.forEach(n => allColors.add(getTypeStyle(n.type).color));
  for (const c of allColors) {
    const id = 'arrow-' + c.replace('#', '');
    defs.append('marker')
      .attr('id', id)
      .attr('viewBox', '0 -5 10 10')
      .attr('refX', 37)
      .attr('refY', 0)
      .attr('markerUnits', 'userSpaceOnUse')
      .attr('markerWidth', 9)
      .attr('markerHeight', 9)
      .attr('orient', 'auto')
      .append('path')
      .attr('d', 'M0,-4L10,0L0,4')
      .attr('fill', c);
  }

  const g = svg.append('g');

  // Zoom
  const zoomBehavior = d3.zoom()
    .scaleExtent([0.2, 5])
    .on('zoom', (event) => g.attr('transform', event.transform));
  svg.call(zoomBehavior);

  // ── Horizontal Timeline Layout ──
  // Dates flow LEFT → RIGHT (oldest to newest). Within each date lane,
  // docs that reference each other form vertical chains. Unconnected
  // docs sit side-by-side in separate columns. This keeps linked docs
  // visually grouped while spreading unrelated docs horizontally.
  // Group docs by date (research already hoisted to top strip)
  const byDate = {};
  const undatedNodes = [];
  nodes.forEach(n => {
    if (!n.date) {
      undatedNodes.push(n);
    } else {
      (byDate[n.date] = byDate[n.date] || []).push(n);
    }
  });
  const dates = Object.keys(byDate).sort();

  // Find connected components among locals within a single date.
  // Two docs are connected if there's any edge between them (either direction).
  function findComponents(dateNodes) {
    const idSet = new Set(dateNodes.map(n => n.id));
    const adj = new Map();
    dateNodes.forEach(n => adj.set(n.id, new Set()));

    for (const e of edges) {
      if (idSet.has(e.source) && idSet.has(e.target)) {
        adj.get(e.source).add(e.target);
        adj.get(e.target).add(e.source);
      }
    }

    const visited = new Set();
    const components = [];

    for (const n of dateNodes) {
      if (visited.has(n.id)) continue;
      const comp = [];
      const queue = [n.id];
      while (queue.length) {
        const cur = queue.shift();
        if (visited.has(cur)) continue;
        visited.add(cur);
        comp.push(cur);
        for (const neighbor of adj.get(cur)) {
          if (!visited.has(neighbor)) queue.push(neighbor);
        }
      }
      components.push(comp);
    }
    return components; // array of arrays of node IDs
  }

  // BFS traversal within a component, returning nodes tagged with their
  // BFS level (depth from root). Used to drive the tree-style layout:
  // level 0 = root(s), level 1 = direct children, etc.
  function orderComponent(compIds, dateNodes) {
    const idSet = new Set(compIds);
    const nodeMap = new Map(dateNodes.map(n => [n.id, n]));

    // Build directed adjacency: source → targets (within component)
    const children = new Map();
    const parentCount = new Map();
    compIds.forEach(id => { children.set(id, []); parentCount.set(id, 0); });

    for (const e of edges) {
      if (idSet.has(e.source) && idSet.has(e.target)) {
        children.get(e.source).push(e.target);
        parentCount.set(e.target, parentCount.get(e.target) + 1);
      }
    }

    // Roots = nodes with no incoming edges from within the component
    const roots = compIds.filter(id => parentCount.get(id) === 0);
    if (roots.length === 0) {
      return compIds.map(id => ({ node: nodeMap.get(id), level: 0 }));
    }

    const result = [];
    const seen = new Set();
    let level = 0;
    let frontier = [...roots];
    while (frontier.length) {
      frontier.sort((a, b) => (nodeMap.get(a).name || '').localeCompare(nodeMap.get(b).name || ''));
      const next = [];
      for (const id of frontier) {
        if (seen.has(id)) continue;
        seen.add(id);
        result.push({ node: nodeMap.get(id), level });
        for (const child of children.get(id)) {
          if (!seen.has(child)) next.push(child);
        }
      }
      frontier = next;
      level++;
    }
    // Any remaining (cycles) get placed at the current level
    compIds.forEach(id => {
      if (!seen.has(id)) result.push({ node: nodeMap.get(id), level });
    });
    return result;
  }

  // ── Layout constants ──
  const CHAIN_COL_WIDTH = 240;   // horizontal slot width per node
  const CHAIN_COL_GAP = 30;      // gap between components within a lane
  const COL_GAP = 110;           // gap between lanes
  const ROW_SPACING = 130;       // vertical gap between rows in a tree
  const HEADER_HEIGHT = 64;      // space at top of lane for date label
  const LANE_PAD_X = 60;         // horizontal padding inside lane card
  const LANE_PAD_BOT = 80;       // padding below last node
  const MAX_PER_ROW = 5;         // wrap BFS levels wider than this into sub-rows

  // ── Place locals into lanes ──
  // For each date, find connected components and lay them out as
  // side-by-side vertical chains.
  const lanes = [];
  let cursorX = 0;

  dates.forEach((date, i) => {
    if (i > 0) {
      cursorX += COL_GAP;
    }

    const dateNodes = byDate[date];
    const components = findComponents(dateNodes);

    // Order components: largest (most connected) first for visual weight
    components.sort((a, b) => b.length - a.length);

    const lane = {
      date,
      x1: cursorX,
      x2: cursorX, // grows as we place components
      topY: 0,
      bottomY: 0,
      locals: [],
    };

    let maxBottom = HEADER_HEIGHT;
    let compCursorX = 0; // horizontal offset from lane start

    components.forEach((compIds, colIdx) => {
      if (colIdx > 0) compCursorX += CHAIN_COL_GAP;
      const items = orderComponent(compIds, dateNodes); // [{node, level}]

      // Group nodes by BFS level. Each level becomes one or more sub-rows.
      const levelMap = new Map();
      items.forEach(({ node, level }) => {
        if (!levelMap.has(level)) levelMap.set(level, []);
        levelMap.get(level).push(node);
      });

      // For each level, compute how many sub-rows it needs and the
      // width-per-sub-row so the level wraps evenly when wide.
      const levelLayouts = [...levelMap.keys()].sort((a,b) => a-b).map(lvl => {
        const nodes = levelMap.get(lvl);
        const subRows = Math.max(1, Math.ceil(nodes.length / MAX_PER_ROW));
        const perRow = Math.ceil(nodes.length / subRows);
        return { nodes, subRows, perRow };
      });

      // Component width = widest sub-row across all levels.
      const widestRow = Math.max(1, ...levelLayouts.map(l => l.perRow));
      const compWidth = widestRow * CHAIN_COL_WIDTH;
      const compStartX = cursorX + compCursorX;

      // Place level-by-level, centering each sub-row within the component.
      let yRow = HEADER_HEIGHT;
      levelLayouts.forEach(layout => {
        for (let r = 0; r < layout.subRows; r++) {
          const rowNodes = layout.nodes.slice(r * layout.perRow, (r + 1) * layout.perRow);
          const rowWidth = rowNodes.length * CHAIN_COL_WIDTH;
          const rowStartX = compStartX + (compWidth - rowWidth) / 2;
          rowNodes.forEach((n, i) => {
            n.x = rowStartX + i * CHAIN_COL_WIDTH + CHAIN_COL_WIDTH / 2;
            n.y = yRow;
            lane.locals.push(n);
          });
          yRow += ROW_SPACING;
        }
      });

      const compBottom = yRow - ROW_SPACING;
      if (compBottom > maxBottom) maxBottom = compBottom;

      compCursorX += compWidth;
    });

    const laneWidth = Math.max(compCursorX, CHAIN_COL_WIDTH);
    lane.x2 = cursorX + laneWidth;
    lane.bottomY = maxBottom + LANE_PAD_BOT;
    lanes.push(lane);
    cursorX += laneWidth;
  });

  // Lane card tops are uniform (no external nodes above)
  lanes.forEach(lane => {
    lane.topY = 0;
    lane.cardTop = 0;
  });

  // Research nodes are rendered in the top strip now, not in the timeline.

  // dayBoxes -> laneBoxes (rendered as vertical lane cards)
  const laneBoxes = lanes.map(lane => ({
    date: lane.date,
    x1: lane.x1 - LANE_PAD_X / 2,
    x2: lane.x2 + LANE_PAD_X / 2,
    y1: lane.cardTop - 30,
    y2: lane.bottomY,
  }));

  // Pin every node so nothing drifts.
  nodes.forEach(n => { n.fx = n.x; n.fy = n.y; });

  // Focus on the 3 most recent date lanes on initial load.
  // User can scroll/zoom to see older lanes.
  const FOCUS_LANES = 3;
  const recentBoxes = laneBoxes.slice(-Math.min(FOCUS_LANES, laneBoxes.length));
  const focMinX = Math.min(...recentBoxes.map(b => b.x1));
  const focMaxX = Math.max(...recentBoxes.map(b => b.x2));
  const focMinY = Math.min(...recentBoxes.map(b => b.y1));
  const focMaxY = Math.max(...recentBoxes.map(b => b.y2));
  const PAD = 40;
  // Reserve vertical space for the fixed top strip so the lanes center in
  // the actually-visible area instead of drifting under the top nav.
  const stripEl = document.getElementById('guide-strip');
  const topOffset = stripEl ? Math.ceil(stripEl.getBoundingClientRect().bottom) + 8 : 140;
  const bottomOffset = 32;
  const visibleH = Math.max(200, height - topOffset - bottomOffset);
  const focW = (focMaxX - focMinX) + PAD * 2;
  const focH = (focMaxY - focMinY) + PAD * 2;
  const scale = Math.min(width / focW, visibleH / focH, 1.2);
  const cx = (focMinX + focMaxX) / 2;
  const cy = (focMinY + focMaxY) / 2;
  const tx = width / 2 - cx * scale;
  const ty = topOffset + visibleH / 2 - cy * scale;
  svg.call(zoomBehavior.transform, d3.zoomIdentity.translate(tx, ty).scale(scale));

  const sim = d3.forceSimulation(nodes)
    .force('link', d3.forceLink(resolvedEdges).id(d => d.id))
    .alphaDecay(0.2);

  // ── Layers ──
  const dayLayer = g.append('g');
  const edgeLayer = g.append('g');
  const nodeLayer = g.append('g');

  // ── Lane cards (vertical) ──
  // Format date as "Apr 2, 2026"
  function formatDate(iso) {
    if (!iso || !/^\d{4}-\d{2}-\d{2}$/.test(iso)) return iso;
    const [y, m, d] = iso.split('-').map(Number);
    const months = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
    return `${months[m-1]} ${d}, ${y}`;
  }
  function shortDate(iso) {
    if (!iso || !/^\d{4}-\d{2}-\d{2}$/.test(iso)) return iso;
    const [y, m, d] = iso.split('-').map(Number);
    const months = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
    return `${months[m-1]} ${d}`;
  }

  dayLayer.selectAll('g')
    .data(laneBoxes)
    .join('g')
    .each(function(d) {
      const sel = d3.select(this);
      sel.append('rect')
        .attr('x', d.x1)
        .attr('y', d.y1)
        .attr('width', d.x2 - d.x1)
        .attr('height', d.y2 - d.y1)
        .attr('rx', 18)
        .attr('ry', 18)
        .attr('fill', '#ffffff')
        .attr('stroke', '#e8e8de')
        .attr('stroke-width', 1);
      // Date header — centered at top of lane.
      // ISO date removed: the formatted date is enough, the iso string
      // read as debug noise.
      const cx = (d.x1 + d.x2) / 2;
      sel.append('text')
        .attr('x', cx)
        .attr('y', d.y1 + 36)
        .attr('text-anchor', 'middle')
        .attr('font-size', 16)
        .attr('font-weight', 700)
        .attr('fill', '#2a2a35')
        .text(formatDate(d.date));
    });

  // ── Edges (curved paths with arrows) ──
  // Only within-day edges are drawn. Cross-day edges were filtered upstream.
  const link = edgeLayer.selectAll('path')
    .data(resolvedEdges)
    .join('path')
    .attr('class', 'link')
    .attr('fill', 'none')
    .attr('stroke', '#c4c4ba')
    .attr('stroke-width', 1.4)
    .attr('marker-end', 'url(#arrow-b8b8b0)');

  // ── Nodes ──
  const node = nodeLayer.selectAll('g')
    .data(nodes)
    .join('g')
    .attr('class', 'node node-clickable');

  // Glow — research nodes only (helps them read as a distinct "dataset" shape).
  // Doc glows removed: clean circles feel lighter and less busy.
  node.filter(d => d.type === 'research').append('rect')
    .attr('x', -54).attr('y', -40).attr('width', 108).attr('height', 80)
    .attr('rx', 14).attr('ry', 14)
    .attr('fill', d => getTypeStyle(d.type).color)
    .attr('opacity', 0.10);

  // Main shape — circle for docs, rounded rect for research
  node.filter(d => d.type !== 'research').append('circle')
    .attr('r', 22)
    .attr('fill', '#ffffff')
    .attr('stroke', d => getTypeStyle(d.type).color)
    .attr('stroke-width', 2);
  node.filter(d => d.type === 'research').append('rect')
    .attr('x', -45).attr('y', -32).attr('width', 90).attr('height', 64)
    .attr('rx', 12).attr('ry', 12)
    .attr('fill', '#ffffff')
    .attr('stroke', d => getTypeStyle(d.type).color)
    .attr('stroke-width', 2.5);

  // Icon
  node.append('text')
    .text(d => getTypeStyle(d.type).icon)
    .attr('text-anchor', 'middle')
    .attr('dominant-baseline', 'central')
    .attr('font-size', d => d.type === 'research' ? 22 : 14)
    .attr('fill', d => getTypeStyle(d.type).color);

  // Source counts are surfaced in the panel's Sources list — no node badge
  // needed. Keeps one badge slot (top-right) reserved for the chart button.

  // Chart badge — top-right button that opens the attached chart overlay.
  // Present only on nodes whose parent doc has a paired chart.
  const chartStyle = getTypeStyle('chart');
  node.filter(d => chartByParent[d.id]).each(function(d) {
    const chart = chartByParent[d.id];
    const r = 11;
    const badge = d3.select(this).append('g')
      .attr('class', 'chart-badge')
      .attr('transform', 'translate(18, -18)')
      .style('cursor', 'pointer');
    badge.append('circle')
      .attr('r', r)
      .attr('fill', chartStyle.color);
    badge.append('text')
      .text(chartStyle.icon)
      .attr('text-anchor', 'middle')
      .attr('dominant-baseline', 'central')
      .attr('font-size', 11)
      .attr('fill', '#ffffff');
    // Click on the badge opens the chart overlay, not the doc panel.
    badge.on('click', (event) => {
      event.stopPropagation();
      openChartOverlay(chart);
    });
    badge.on('mouseenter', (event) => {
      tooltip.innerHTML = `
        <div class="tt-name">${chart.name}</div>
        <div class="tt-type" style="color:${chartStyle.color}">Chart · attached to ${d.name}</div>
        <div class="tt-hint">Click to open chart</div>
      `;
      tooltip.style.opacity = 1;
      event.stopPropagation();
    });
    badge.on('mouseleave', () => {
      tooltip.style.opacity = 0;
    });
  });

  // Notion-sync indicator — top-left pip. Signals the doc is bound to a
  // canonical Notion page (two-way sync), as opposed to just linking to one.
  const refStyle = getTypeStyle('ref');
  node.filter(d => d.notion_id).each(function(d) {
    const r = 8;
    const mark = d3.select(this).append('g')
      .attr('class', 'notion-mark')
      .attr('transform', 'translate(-18, -18)')
      .style('pointer-events', 'auto')
      .style('cursor', 'help');
    mark.append('circle')
      .attr('r', r)
      .attr('fill', '#ffffff')
      .attr('stroke', refStyle.color)
      .attr('stroke-width', 1.5);
    mark.append('text')
      .text('⇌')
      .attr('text-anchor', 'middle')
      .attr('dominant-baseline', 'central')
      .attr('font-size', 9)
      .attr('font-weight', 700)
      .attr('fill', refStyle.color);
    mark.on('mouseenter', (event) => {
      tooltip.innerHTML = `
        <div class="tt-name">Synced to Notion</div>
        <div class="tt-type" style="color:${refStyle.color}">notion_id · ${d.notion_id}</div>
        <div class="tt-hint">This doc is bound to a canonical Notion page</div>
      `;
      tooltip.style.opacity = 1;
      event.stopPropagation();
    });
    mark.on('mouseleave', () => { tooltip.style.opacity = 0; });
  });

  // Labels
  const MAX_LABEL = 32;
  node.append('text')
    .text(d => {
      let label = d.name;
      if (label.length > MAX_LABEL) label = label.substring(0, MAX_LABEL - 1) + '…';
      return label;
    })
    .attr('y', d => d.type === 'research' ? 52 : 40)
    .attr('text-anchor', 'middle')
    .attr('font-size', d => d.type === 'research' ? 13 : 12)
    .attr('font-weight', d => d.type === 'research' ? 700 : 600)
    .attr('fill', '#2a2a35')
    .attr('letter-spacing', '0.01em');

  // Note: date subtitle removed — the lane header already shows the date.

  // ── Tooltip + Focus on hover ──
  const tooltip = document.getElementById('tooltip');

  function neighborIds(id) {
    const set = new Set([id]);
    for (const e of resolvedEdges) {
      const sid = (e.source.id || e.source);
      const tid = (e.target.id || e.target);
      if (sid === id) set.add(tid);
      if (tid === id) set.add(sid);
    }
    return set;
  }

  node.on('mouseenter', (event, d) => {
    const style = getTypeStyle(d.type);
    tooltip.innerHTML = `
      <div class="tt-name">${d.name}</div>
      <div class="tt-type" style="color:${style.color}">${d.type}${d.date ? '  ·  ' + formatDate(d.date) : ''}${extRefCount[d.id] ? '  ·  ' + extRefCount[d.id] + ' source' + (extRefCount[d.id] > 1 ? 's' : '') : ''}</div>
      ${d.description ? `<div class="tt-desc">${d.description}</div>` : ''}
      <div class="tt-path">${d.path}</div>
      <div class="tt-hint">Click to open</div>
    `;
    tooltip.style.opacity = 1;

    // Focus mode — dim everything not connected to this node
    const neighbors = neighborIds(d.id);
    node.classed('dimmed', n => !neighbors.has(n.id));
    link.classed('dimmed', l => {
      const sid = (l.source.id || l.source);
      const tid = (l.target.id || l.target);
      return sid !== d.id && tid !== d.id;
    });

    // Highlight connected edges
    link.filter(l => {
      const sid = (l.source.id || l.source);
      const tid = (l.target.id || l.target);
      return sid === d.id || tid === d.id;
    })
      .attr('stroke', style.color)
      .attr('stroke-width', 2.2)
      .attr('marker-end', `url(#arrow-${style.color.replace('#','')})`);
  })
  .on('mousemove', (event) => {
    tooltip.style.left = (event.clientX + 14) + 'px';
    tooltip.style.top = (event.clientY - 8) + 'px';
  })
  .on('mouseleave', (event, d) => {
    tooltip.style.opacity = 0;
    node.classed('dimmed', false);
    link.classed('dimmed', false)
      .attr('stroke', '#c4c4ba')
      .attr('stroke-width', 1.4)
      .attr('marker-end', 'url(#arrow-b8b8b0)');
  });

  // ── Side panel ──
  const panel = document.getElementById('panel');
  const panelType = document.getElementById('panel-type');
  const panelName = document.getElementById('panel-name');
  const panelMeta = document.getElementById('panel-meta');
  const panelBody = document.getElementById('panel-body');

  // ── Chart overlay ──
  const chartOverlay = document.getElementById('chart-overlay');
  const chartOverlayType = document.getElementById('chart-overlay-type');
  const chartOverlayName = document.getElementById('chart-overlay-name');
  const chartIframe = document.getElementById('chart-iframe');

  function openChartOverlay(d) {
    const style = getTypeStyle(d.type);
    chartOverlayType.textContent = style.label || d.type;
    chartOverlayType.style.color = style.color;
    chartOverlayType.style.background = style.color + '15';
    chartOverlayName.textContent = d.name;
    chartIframe.src = 'charts/' + d.chart;
    chartOverlay.classList.add('open');
    history.replaceState(null, '', '#' + encodeURIComponent(d.id));
  }

  function closeChartOverlay() {
    chartOverlay.classList.remove('open');
    chartIframe.src = '';
    history.replaceState(null, '', window.location.pathname);
  }

  document.getElementById('chart-overlay-close').addEventListener('click', closeChartOverlay);
  document.getElementById('chart-overlay-download').addEventListener('click', () => {
    chartIframe.contentWindow.postMessage({ action: 'downloadAsImage' }, '*');
  });

  function openPanel(d) {
    // Chart-type docs open in full-screen overlay instead of side panel
    if (d.type === 'chart' && d.chart) {
      openChartOverlay(d);
      return;
    }
    const style = getTypeStyle(d.type);
    panelType.textContent = style.label || d.type;
    panelType.style.color = style.color;
    panelType.style.background = style.color + '15';
    panelName.textContent = d.name;
    const metaParts = [];
    if (d.date) metaParts.push(formatDate(d.date));
    if (extRefCount[d.id]) metaParts.push(`${extRefCount[d.id]} ref${extRefCount[d.id] > 1 ? 's' : ''}`);
    if (d.path) metaParts.push(`<span style="font-family:ui-monospace,monospace;color:#9a9aa8">${d.path}</span>`);
    panelMeta.innerHTML = metaParts.join('  ·  ');

    let bodyHtml = '';

    // Synced section — present when this doc is bound to a canonical Notion
    // page via a notion_id frontmatter field. Distinguishes "this doc IS the
    // Notion page" from "this doc just links to one" (the Links group).
    if (d.notion_id) {
      const nid = d.notion_id.replace(/-/g, '');
      const notionUrl = `https://www.notion.so/${nid}`;
      bodyHtml += '<div style="margin-bottom:14px;padding:12px 16px;background:#f0ece4;border:1px solid #e4dcc8;border-radius:10px;">';
      bodyHtml += '<div style="font-size:10px;text-transform:uppercase;letter-spacing:0.08em;color:#8A6D3B;font-weight:600;margin-bottom:6px;">Synced</div>';
      bodyHtml += `<div style="display:flex;align-items:baseline;gap:8px;font-size:13px;line-height:1.4;">`;
      bodyHtml += `<span style="color:#8A6D3B;font-size:12px;flex-shrink:0;width:14px;text-align:center;">⇌</span>`;
      bodyHtml += `<a href="${notionUrl}" target="_blank" rel="noopener" style="color:#3F6FD9;text-decoration:none;border-bottom:1px solid #c8d4f0;">${d.name}</a>`;
      bodyHtml += `<span style="color:#b0b0bc;font-size:10px;">notion.so</span>`;
      bodyHtml += `</div>`;
      bodyHtml += `<div style="margin-left:22px;margin-top:2px;font-family:ui-monospace,monospace;font-size:10px;color:#9a9aa8;">${d.notion_id}</div>`;
      bodyHtml += '</div>';
    }

    // External references section — local edges are already visible in the graph.
    // Grouped by category so you can quickly scan: what's a Notion link,
    // what's a ref/guide/data doc, etc.
    const extRefs = (extRefsFor[d.id] || []);
    if (extRefs.length) {
      // Resolve each target to its category.
      const resolved = extRefs.map(target => {
        const extNode = allNodes.find(n => n.id === target);
        const isUrl = /^https?:\/\//i.test(target);
        let group;
        if (isUrl) group = 'Links';
        else if (extNode && extNode.type === 'ref')      group = 'Refs';
        else if (extNode && extNode.type === 'guide')    group = 'Guides';
        else if (extNode && extNode.type === 'research') group = 'Data';
        else if (extNode && extNode.type === 'chart')    group = 'Charts';
        else                                             group = 'Docs';
        return { target, extNode, isUrl, group };
      });

      // Group entries in display order.
      const order = ['Guides','Refs','Data','Charts','Docs','Links'];
      const groups = new Map(order.map(k => [k, []]));
      resolved.forEach(r => groups.get(r.group).push(r));

      bodyHtml += '<div style="margin-bottom:20px;padding:14px 16px;background:#f8f8f5;border-radius:10px;">';
      bodyHtml += '<div style="font-size:10px;text-transform:uppercase;letter-spacing:0.08em;color:#9a9aa8;font-weight:600;margin-bottom:10px;">Sources</div>';

      for (const groupName of order) {
        const items = groups.get(groupName);
        if (!items.length) continue;
        bodyHtml += `<div style="font-size:9px;text-transform:uppercase;letter-spacing:0.1em;color:#b0b0bc;font-weight:600;margin:10px 0 5px;">${groupName}</div>`;
        items.forEach(({ target, extNode, isUrl }) => {
          const name = extNode ? extNode.name : target.split('/').pop().substring(0, 60);
          const typeStyle = extNode ? getTypeStyle(extNode.type) : { color: '#8a8a98', icon: '↗' };
          let domain = '';
          if (isUrl) {
            try { domain = new URL(target).hostname.replace(/^www\./, ''); } catch (e) { domain = ''; }
          }
          const href = isUrl ? target : ('#' + encodeURIComponent(target));
          const linkAttrs = isUrl
            ? 'target="_blank" rel="noopener"'
            : `data-internal-id="${target.replace(/"/g, '&quot;')}"`;
          const icon = isUrl ? '↗' : typeStyle.icon;
          bodyHtml += `<div style="display:flex;align-items:baseline;gap:8px;margin:4px 0;font-size:13px;line-height:1.4;">`;
          bodyHtml += `<span style="color:${typeStyle.color};font-size:12px;flex-shrink:0;width:14px;text-align:center;">${icon}</span>`;
          bodyHtml += `<a href="${href}" ${linkAttrs} style="color:#3F6FD9;text-decoration:none;border-bottom:1px solid #c8d4f0;">${name}</a>`;
          if (domain) bodyHtml += `<span style="color:#b0b0bc;font-size:10px;">${domain}</span>`;
          bodyHtml += `</div>`;
        });
      }
      bodyHtml += '</div>';
    }

    // Document content — strip leading h1 if it duplicates the panel header
    let content = d.content || '';
    // Remove first markdown heading if it matches the doc name
    content = content.replace(/^#\s+.*\n+/, '');

    if (content.trim() && typeof marked !== 'undefined') {
      bodyHtml += marked.parse(content);
    } else if (content.trim()) {
      bodyHtml += '<pre style="white-space:pre-wrap;font-family:inherit">' +
        content.replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c])) + '</pre>';
    } else if (!extRefs.length) {
      bodyHtml += '<p style="color:#9a9aa8">No content available.</p>';
    }

    panelBody.innerHTML = bodyHtml;
    panelBody.scrollTop = 0;
    panel.classList.add('open');
    document.getElementById('panel-backdrop').classList.add('open');
    // Persist open panel in URL hash so refresh keeps it open
    history.replaceState(null, '', '#' + encodeURIComponent(d.id));

    // Wire up internal Sources links to swap the panel to the target doc.
    panelBody.querySelectorAll('a[data-internal-id]').forEach(a => {
      a.addEventListener('click', (ev) => {
        ev.preventDefault();
        const id = a.getAttribute('data-internal-id');
        const target = allNodes.find(n => n.id === id);
        if (target) openPanel(target);
      });
    });
  }

  function closePanel() {
    panel.classList.remove('open');
    document.getElementById('panel-backdrop').classList.remove('open');
    history.replaceState(null, '', window.location.pathname);
  }

  // ── Top strip: guides row + data row ──
  // Guides are always-on reference material (tone, scope).
  // Data nodes are the research folders docs draw from.
  // Both sit above the timeline instead of cluttering it with edges.
  function addStripRow(label, items, variant) {
    if (!items.length) return;
    const row = document.createElement('div');
    row.className = 'strip-row';
    const labelEl = document.createElement('span');
    labelEl.className = 'strip-label';
    labelEl.textContent = label;
    row.appendChild(labelEl);
    items.forEach(n => {
      const style = getTypeStyle(n.type);
      const pill = document.createElement('button');
      pill.className = 'strip-pill ' + variant;
      pill.type = 'button';
      pill.innerHTML = `<span class="icon">${style.icon}</span><span>${n.name}</span>`;
      pill.addEventListener('click', (e) => {
        e.stopPropagation();
        openPanel(n);
      });
      row.appendChild(pill);
    });
    guideStripEl.appendChild(row);
  }
  // Sort pills newest-first so the most recent material sits leftmost.
  const byDateDesc = (a, b) => (b.date || '').localeCompare(a.date || '');
  addStripRow('Guides', [...guideNodes].sort(byDateDesc), 'guide');
  addStripRow('Refs',   [...refNodes].sort(byDateDesc),   'ref');
  addStripRow('Data',   [...dataNodes].sort(byDateDesc),  'data');

  // Stats footer — lives inside the strip, below the data row. Shows only the
  // timeline-visible types (docs, reviews, charts). The guide/ref/data counts
  // are implicit in the pill rows above.
  const statsSegments = [];
  const pushSeg = (type, count, label) => {
    if (!count) return;
    const s = getTypeStyle(type);
    statsSegments.push(
      `<span class="strip-stats-item">` +
      `<span class="strip-stats-icon" style="color:${s.color};">${s.icon}</span>` +
      `<span>${count} ${label}</span>` +
      `</span>`
    );
  };
  pushSeg('doc',    docCount,    docCount === 1 ? 'doc' : 'docs');
  pushSeg('review', reviewCount, reviewCount === 1 ? 'review' : 'reviews');
  pushSeg('chart',  chartTotal,  chartTotal === 1 ? 'chart' : 'charts');
  if (statsSegments.length) {
    const statsRow = document.createElement('div');
    statsRow.className = 'strip-stats';
    statsRow.innerHTML = statsSegments.join('<span class="strip-stats-sep"> · </span>');
    guideStripEl.appendChild(statsRow);
  }

  document.getElementById('panel-close').addEventListener('click', closePanel);
  document.getElementById('panel-backdrop').addEventListener('click', closePanel);
  document.getElementById('panel-refresh').addEventListener('click', () => {
    window.location.reload();
  });
  document.addEventListener('keydown', e => {
    if (e.key === 'Escape') {
      closePanel();
      closeChartOverlay();
    }
  });

  // Auto-open panel if URL hash points to a doc (skip animation on restore)
  if (window.location.hash) {
    const hashId = decodeURIComponent(window.location.hash.slice(1));
    const target = nodes.find(n => n.id === hashId);
    if (target) {
      panel.style.transition = 'none';
      document.getElementById('panel-backdrop').style.transition = 'none';
      openPanel(target);
      // Re-enable transitions after paint
      requestAnimationFrame(() => {
        panel.style.transition = '';
        document.getElementById('panel-backdrop').style.transition = '';
      });
    }
  }

  node.on('click', (event, d) => {
    event.stopPropagation();
    openPanel(d);
  });

  // ── Tick ──
  sim.on('tick', () => {
    // Tree-style orthogonal S-curve edges (parent above, child below)
    link.attr('d', d => {
      const sx = d.source.x, sy = d.source.y;
      const tx = d.target.x, ty = d.target.y;
      const dy = ty - sy;
      // If parent is clearly above child, use vertical S-curve
      if (Math.abs(dy) > 20) {
        const midY = sy + dy / 2;
        return `M${sx},${sy} C${sx},${midY} ${tx},${midY} ${tx},${ty}`;
      }
      // Sibling-ish (same row) connection: gentle horizontal S
      const midX = (sx + tx) / 2;
      return `M${sx},${sy} C${midX},${sy} ${midX},${ty} ${tx},${ty}`;
    });

    node.attr('transform', d => `translate(${d.x},${d.y})`);
  });
}

init();

</script>
</body>
</html>
