<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Docs Graph</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: #f7f7f4;
    color: #2a2a35;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
    overflow: hidden;
    height: 100vh;
  }

  #header {
    position: fixed;
    top: 0; left: 0; right: 0;
    z-index: 10;
    padding: 20px 28px;
    background: linear-gradient(to bottom, #f7f7f4 70%, transparent);
    pointer-events: none;
    display: flex;
    align-items: baseline;
    gap: 16px;
  }

  #header h1 {
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.12em;
    color: #6a6a78;
    text-transform: uppercase;
    pointer-events: auto;
  }

  #header .stats {
    font-size: 11px;
    color: #9a9aa8;
    pointer-events: auto;
  }

  #legend {
    position: fixed;
    bottom: 24px;
    left: 28px;
    z-index: 10;
    display: flex;
    gap: 16px;
    font-size: 11px;
    color: #6a6a78;
    background: rgba(255,255,255,0.85);
    backdrop-filter: blur(8px);
    padding: 10px 14px;
    border-radius: 10px;
    border: 1px solid #e4e4dc;
  }

  .legend-item {
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .legend-dot {
    width: 9px;
    height: 9px;
    border-radius: 50%;
    flex-shrink: 0;
  }

  #tooltip {
    position: fixed;
    z-index: 20;
    background: #ffffff;
    border: 1px solid #e0e0d8;
    border-radius: 10px;
    padding: 14px 18px;
    max-width: 320px;
    pointer-events: none;
    opacity: 0;
    transition: opacity 0.12s;
    font-size: 13px;
    line-height: 1.5;
    box-shadow: 0 8px 32px rgba(40, 40, 60, 0.12);
  }

  #tooltip .tt-name {
    font-weight: 600;
    font-size: 13px;
    margin-bottom: 3px;
    color: #1a1a25;
  }

  #tooltip .tt-type {
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    margin-bottom: 8px;
    font-weight: 600;
  }

  #tooltip .tt-desc {
    color: #5a5a68;
    font-size: 12px;
    line-height: 1.5;
  }

  #tooltip .tt-path {
    color: #9a9aa8;
    font-size: 10px;
    margin-top: 8px;
    font-family: 'SF Mono', 'Fira Code', 'Consolas', monospace;
  }

  #tooltip .tt-hint {
    color: #b0b0b8;
    font-size: 10px;
    margin-top: 6px;
    font-style: italic;
  }

  svg { display: block; }

  /* Focus mode — applied to <g.node> and <path.link> via classes */
  .dimmed { opacity: 0.12; transition: opacity 0.18s; }
  .focused { opacity: 1; transition: opacity 0.18s; }
  .node-clickable { cursor: pointer; }

  /* ── Side panel ── */
  #panel {
    position: fixed;
    top: 0;
    right: 0;
    bottom: 0;
    width: 60vw;
    max-width: 900px;
    background: #ffffff;
    border-left: 1px solid #e6e6dc;
    box-shadow: -16px 0 48px rgba(40, 40, 60, 0.06);
    z-index: 30;
    transform: translateX(100%);
    transition: transform 0.28s cubic-bezier(.4, 0, .2, 1);
    display: flex;
    flex-direction: column;
  }
  #panel.open { transform: translateX(0); }
  #panel-backdrop {
    position: fixed; inset: 0; background: rgba(20,20,30,0.18);
    opacity: 0; pointer-events: none; transition: opacity 0.2s; z-index: 29;
  }
  #panel-backdrop.open { opacity: 1; pointer-events: auto; }

  #panel-header {
    padding: 24px 32px 18px;
    border-bottom: 1px solid #f0f0e8;
    flex-shrink: 0;
  }
  #panel-close {
    position: absolute;
    top: 18px;
    right: 22px;
    width: 32px;
    height: 32px;
    border: none;
    background: transparent;
    color: #9a9aa8;
    font-size: 22px;
    cursor: pointer;
    border-radius: 6px;
    line-height: 1;
    transition: background 0.12s;
  }
  #panel-close:hover { background: #f0f0e8; color: #2a2a35; }

  #panel-type {
    display: inline-block;
    font-size: 10px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    padding: 4px 10px;
    border-radius: 4px;
    margin-bottom: 10px;
  }
  #panel-name {
    font-size: 22px;
    font-weight: 700;
    color: #1a1a25;
    line-height: 1.25;
    margin-bottom: 8px;
    padding-right: 40px;
  }
  #panel-meta {
    font-size: 12px;
    color: #9a9aa8;
    font-family: 'SF Mono', 'Fira Code', monospace;
  }
  #panel-meta a {
    color: #6a6a78;
    text-decoration: none;
    border-bottom: 1px dotted #c4c4ba;
  }
  #panel-meta a:hover { color: #2a2a35; }

  #panel-body {
    padding: 24px 32px 48px;
    overflow-y: auto;
    flex: 1;
    font-size: 14px;
    line-height: 1.65;
    color: #2a2a35;
  }
  #panel-body h1, #panel-body h2, #panel-body h3, #panel-body h4 {
    color: #1a1a25;
    font-weight: 700;
    margin-top: 1.4em;
    margin-bottom: 0.5em;
    line-height: 1.3;
  }
  #panel-body h1 { font-size: 22px; margin-top: 0; }
  #panel-body h2 { font-size: 17px; }
  #panel-body h3 { font-size: 14px; text-transform: uppercase; letter-spacing: 0.04em; color: #5a5a68; }
  #panel-body p { margin-bottom: 0.9em; }
  #panel-body ul, #panel-body ol { margin: 0 0 1em 1.4em; }
  #panel-body li { margin-bottom: 0.3em; }
  #panel-body strong { color: #1a1a25; font-weight: 600; }
  #panel-body em { color: #5a5a68; }
  #panel-body code {
    background: #f4f4ec;
    padding: 1px 6px;
    border-radius: 4px;
    font-size: 12px;
    font-family: 'SF Mono', 'Fira Code', monospace;
  }
  #panel-body pre {
    background: #f4f4ec;
    padding: 14px 18px;
    border-radius: 8px;
    overflow-x: auto;
    margin: 1em 0;
  }
  #panel-body pre code { background: transparent; padding: 0; }
  #panel-body hr { border: none; border-top: 1px solid #f0f0e8; margin: 1.6em 0; }
  #panel-body blockquote {
    border-left: 3px solid #e0e0d8;
    padding-left: 16px;
    color: #5a5a68;
    margin: 1em 0;
  }
  #panel-body a { color: #3F6FD9; text-decoration: none; border-bottom: 1px solid #c8d4f0; }
  #panel-body a:hover { border-bottom-color: #3F6FD9; }
</style>
</head>
<body>

<div id="header">
  <h1>Strategy Graph</h1>
  <span class="stats" id="stats"></span>
</div>

<div id="legend"></div>
<div id="tooltip"></div>

<div id="panel-backdrop"></div>
<aside id="panel">
  <button id="panel-close" aria-label="Close">×</button>
  <div id="panel-header">
    <div id="panel-type"></div>
    <div id="panel-name"></div>
    <div id="panel-meta"></div>
  </div>
  <div id="panel-body"></div>
</aside>

<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.9.0/d3.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.0/marked.min.js"></script>
<script>

// ── Embedded Graph Data (auto-replaced by build.py) ─────
// __GRAPH_DATA_START__
const GRAPH_DATA = {"nodes":[], "edges":[], "projects":{}};
// __GRAPH_DATA_END__

// ── Config ──────────────────────────────────────────────

const TYPE_STYLES = {
  synthesis:  { color: '#3F6FD9', icon: '◆', label: 'Synthesis' },
  comments:   { color: '#C77E25', icon: '◉', label: 'Comments' },
  note:       { color: '#3F8C5C', icon: '■', label: 'Note' },
  analysis:   { color: '#9050B0', icon: '▲', label: 'Analysis' },
  decision:   { color: '#C73838', icon: '★', label: 'Decision' },
  brief:      { color: '#0E8A8A', icon: '✎', label: 'Brief' },
  draft:      { color: '#7A8B2A', icon: '✦', label: 'Draft' },
  external:   { color: '#8a8a98', icon: '◇', label: 'Notion' },
};

const PROJECT_PALETTES = [
  { bg: '#ffffff', border: '#e6e6dc', label: '#7a7a88' },
];

function getTypeStyle(type) {
  return TYPE_STYLES[type] || TYPE_STYLES.note;
}

// ── Render ───────────────────────────────────────────────

function init() {
  if (!GRAPH_DATA) {
    document.body.innerHTML = `
      <div style="display:flex;align-items:center;justify-content:center;height:100vh;color:#4a4a60;font-size:13px;">
        <div style="text-align:center">
          <p style="font-size:16px;margin-bottom:8px;color:#6a6a80">No graph data</p>
          <p>Run <code style="background:#16161e;padding:3px 10px;border-radius:6px;font-size:12px;">python build.py</code> to generate</p>
        </div>
      </div>`;
    return;
  }

  const { projects, nodes, edges } = GRAPH_DATA;
  const width = window.innerWidth;
  const height = window.innerHeight;

  // ── Legend ──
  const legendEl = document.getElementById('legend');
  const usedTypes = new Set(nodes.map(n => n.type));
  for (const [type, style] of Object.entries(TYPE_STYLES)) {
    if (!usedTypes.has(type)) continue;
    const item = document.createElement('div');
    item.className = 'legend-item';
    item.innerHTML = `<div class="legend-dot" style="background:${style.color}"></div><span>${style.label}</span>`;
    legendEl.appendChild(item);
  }

  // ── Resolve edges ──
  const nodeIds = new Set(nodes.map(n => n.id));
  const resolvedEdges = edges.filter(e => nodeIds.has(e.source) && nodeIds.has(e.target));

  // ── Stats ──
  const localCount = nodes.filter(n => !n.external).length;
  const extCount = nodes.filter(n => n.external).length;
  document.getElementById('stats').textContent =
    `${localCount} docs · ${extCount} external refs · ${edges.length} references`;

  // ── SVG ──
  const svg = d3.select('body').append('svg').attr('width', width).attr('height', height);

  // Arrow markers — one per type color so arrowheads match edges
  const defs = svg.append('defs');
  const allColors = new Set(['#b8b8b0']); // default
  nodes.forEach(n => allColors.add(getTypeStyle(n.type).color));
  for (const c of allColors) {
    const id = 'arrow-' + c.replace('#', '');
    defs.append('marker')
      .attr('id', id)
      .attr('viewBox', '0 -5 10 10')
      .attr('refX', 24)
      .attr('refY', 0)
      .attr('markerWidth', 7)
      .attr('markerHeight', 7)
      .attr('orient', 'auto')
      .append('path')
      .attr('d', 'M0,-4L10,0L0,4')
      .attr('fill', c);
  }

  const g = svg.append('g');

  // Zoom
  const zoomBehavior = d3.zoom()
    .scaleExtent([0.2, 5])
    .on('zoom', (event) => g.attr('transform', event.transform));
  svg.call(zoomBehavior);

  // ── Horizontal Timeline Layout ──
  // Dates flow LEFT → RIGHT (oldest to newest). Each date is a vertical
  // lane with its main doc on top and descendants stacked below. Externals
  // cluster ABOVE the lane of the doc(s) they're connected to. Externals
  // referenced by multiple lanes float in a "shared" row even higher.
  const localNodes = nodes.filter(n => !n.external);
  const extNodes = nodes.filter(n => n.external);
  const localIdSet = new Set(localNodes.map(n => n.id));

  // Detect parent/child relationships among locals
  const parentOf = {};
  localNodes.forEach(n => {
    for (const e of edges) {
      if (e.source === n.id && localIdSet.has(e.target)) {
        parentOf[n.id] = e.target;
        break;
      }
    }
  });
  const childLocals = localNodes.filter(n => parentOf[n.id]);
  const mainLocals = localNodes.filter(n => !parentOf[n.id]);

  // Group main locals by date
  const byDate = {};
  mainLocals.forEach(n => {
    const d = n.date || 'undated';
    (byDate[d] = byDate[d] || []).push(n);
  });
  const dates = Object.keys(byDate).sort();

  // BFS-collect transitive descendants of a main
  function collectDescendants(main) {
    const out = [];
    const seen = new Set([main.id]);
    let frontier = childLocals.filter(c => parentOf[c.id] === main.id);
    while (frontier.length) {
      const next = [];
      for (const n of frontier) {
        if (seen.has(n.id)) continue;
        seen.add(n.id);
        out.push(n);
        next.push(...childLocals.filter(c => parentOf[c.id] === n.id));
      }
      frontier = next;
    }
    return out;
  }

  // ── Layout constants ──
  const COL_WIDTH = 320;       // horizontal space per date lane
  const COL_GAP = 60;          // gap between lanes
  const ROW_SPACING = 130;     // vertical gap between local docs in a lane
  const HEADER_HEIGHT = 80;    // space at top of lane for date label
  const LANE_PAD_X = 50;       // horizontal padding inside lane card
  const LANE_PAD_BOT = 90;     // padding below last node
  const EXT_ROW_GAP = 100;     // gap between externals row and lane top
  const EXT_NODE_W = 180;      // horizontal width per external slot
  const EXT_NODE_H = 72;       // vertical step per external row
  const SHARED_EXT_GAP = 140;  // gap between shared externals row and per-lane externals

  // ── Place locals into lanes ──
  // For each date, build a vertical column. Track lane bounds.
  const lanes = []; // {date, x1, x2, topY, bottomY, locals: [...] }
  let cursorX = 0;

  dates.forEach(date => {
    const mains = byDate[date];
    const lane = {
      date,
      x1: cursorX,
      x2: cursorX + COL_WIDTH,
      cx: cursorX + COL_WIDTH / 2,
      topY: 0,
      bottomY: 0,
      locals: [],
    };

    let yCursor = HEADER_HEIGHT;
    mains.forEach(m => {
      m.x = lane.cx;
      m.y = yCursor;
      lane.locals.push(m);
      const descendants = collectDescendants(m);
      descendants.forEach(d => {
        yCursor += ROW_SPACING;
        d.x = lane.cx;
        d.y = yCursor;
        lane.locals.push(d);
      });
      yCursor += ROW_SPACING;
    });
    lane.bottomY = yCursor - ROW_SPACING + LANE_PAD_BOT;
    lanes.push(lane);
    cursorX += COL_WIDTH + COL_GAP;
  });

  // ── External clustering ──
  // For each external, find the local docs that reference it.
  // Group: an external is "owned" by a single lane if all its local sources
  // share the same date. Otherwise it's "shared" across lanes.
  const extInfo = extNodes.map(n => {
    const sources = edges
      .filter(e => e.target === n.id && localIdSet.has(e.source))
      .map(e => localNodes.find(l => l.id === e.source))
      .filter(Boolean);
    const sourceDates = [...new Set(sources.map(s => s.date))];
    return { node: n, sources, sourceDates };
  });

  const ownedByLane = {};   // date -> [ext nodes]
  const sharedExts = [];

  extInfo.forEach(info => {
    if (info.sourceDates.length === 1) {
      const d = info.sourceDates[0];
      (ownedByLane[d] = ownedByLane[d] || []).push(info);
    } else if (info.sourceDates.length > 1) {
      sharedExts.push(info);
    } else {
      // Orphan external (no local sources) — bucket into a "_orphan" lane
      (ownedByLane._orphan = ownedByLane._orphan || []).push(info);
    }
  });

  // Within each lane, group owned externals by their FULL source signature
  // so externals referenced by the same local doc(s) cluster tightly.
  function bySignature(items) {
    const groups = new Map();
    items.forEach(info => {
      const sig = info.sources.map(s => s.id).sort().join('|');
      if (!groups.has(sig)) groups.set(sig, []);
      groups.get(sig).push(info);
    });
    return [...groups.values()];
  }

  // Place per-lane externals ABOVE each lane in a small grid (max 2 columns).
  // Track how high above the lane top they extend so we can size lane cards.
  let maxExtTop = 0;
  lanes.forEach(lane => {
    const owned = ownedByLane[lane.date] || [];
    if (!owned.length) return;
    const groups = bySignature(owned);

    // Stack groups upward from the lane top. Within a group, items go in
    // a 2-column grid.
    let topCursor = -EXT_ROW_GAP;
    groups.forEach(group => {
      group.forEach((info, i) => {
        const col = i % 2;
        const row = Math.floor(i / 2);
        info.node.x = lane.cx + (col === 0 ? -EXT_NODE_W / 2 : EXT_NODE_W / 2);
        info.node.y = topCursor - row * EXT_NODE_H;
      });
      const groupRows = Math.ceil(group.length / 2);
      topCursor -= groupRows * EXT_NODE_H + 24;
    });
    if (topCursor < maxExtTop) maxExtTop = topCursor;
  });

  // Place SHARED externals in a row above all lanes, centered between
  // their sources' lanes.
  if (sharedExts.length) {
    const sharedRowY = maxExtTop - SHARED_EXT_GAP;
    sharedExts.forEach((info, i) => {
      // Average x of all source lanes
      const xs = info.sources.map(s => s.x);
      info.node.x = xs.reduce((a, b) => a + b, 0) / xs.length;
      info.node.y = sharedRowY - (i % 2) * EXT_NODE_H * 0.6;
    });
    // De-overlap horizontally
    const sortedShared = [...sharedExts].sort((a, b) => a.node.x - b.node.x);
    const MIN_X_GAP = EXT_NODE_W;
    for (let i = 1; i < sortedShared.length; i++) {
      const prev = sortedShared[i - 1].node;
      const cur = sortedShared[i].node;
      if (cur.x - prev.x < MIN_X_GAP) {
        cur.x = prev.x + MIN_X_GAP;
      }
    }
    if (sharedRowY < maxExtTop) maxExtTop = sharedRowY - EXT_NODE_H;
  }

  // Apply uniform top to all lanes for consistent card heights
  const laneTopY = maxExtTop - 40;
  lanes.forEach(lane => {
    lane.topY = 0;
    lane.cardTop = 0;
  });

  // dayBoxes -> laneBoxes (rendered as vertical lane cards)
  const laneBoxes = lanes.map(lane => ({
    date: lane.date,
    x1: lane.x1 - LANE_PAD_X / 2,
    x2: lane.x2 + LANE_PAD_X / 2,
    y1: lane.cardTop - 30,
    y2: lane.bottomY,
  }));

  // Pin every node so nothing drifts.
  nodes.forEach(n => { n.fx = n.x; n.fy = n.y; });

  // Center the whole graph in the viewport
  const allX = nodes.map(n => n.x);
  const allY = nodes.map(n => n.y);
  const minX = Math.min(...allX), maxX = Math.max(...allX);
  const minY = Math.min(...allY), maxY = Math.max(...allY);
  const graphW = maxX - minX + 200;
  const graphH = maxY - minY + 200;
  const scale = Math.min(width / graphW, height / graphH, 1);
  // Center vertically on full graph, horizontally on the latest lane
  const lastLane = laneBoxes[laneBoxes.length - 1];
  const focusX = lastLane ? (lastLane.x1 + lastLane.x2) / 2 : (minX + maxX) / 2;
  const tx = width / 2 - focusX * scale;
  const ty = height / 2 - ((minY + maxY) / 2) * scale;
  svg.call(zoomBehavior.transform, d3.zoomIdentity.translate(tx, ty).scale(scale));

  const sim = d3.forceSimulation(nodes)
    .force('link', d3.forceLink(resolvedEdges).id(d => d.id))
    .alphaDecay(0.2);

  // ── Layers ──
  const dayLayer = g.append('g');
  const edgeLayer = g.append('g');
  const nodeLayer = g.append('g');

  // ── Lane cards (vertical) ──
  // Format date as "Apr 2, 2026"
  function formatDate(iso) {
    if (!iso || !/^\d{4}-\d{2}-\d{2}$/.test(iso)) return iso;
    const [y, m, d] = iso.split('-').map(Number);
    const months = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
    return `${months[m-1]} ${d}, ${y}`;
  }
  function shortDate(iso) {
    if (!iso || !/^\d{4}-\d{2}-\d{2}$/.test(iso)) return iso;
    const [y, m, d] = iso.split('-').map(Number);
    const months = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
    return `${months[m-1]} ${d}`;
  }

  dayLayer.selectAll('g')
    .data(laneBoxes)
    .join('g')
    .each(function(d) {
      const sel = d3.select(this);
      sel.append('rect')
        .attr('x', d.x1)
        .attr('y', d.y1)
        .attr('width', d.x2 - d.x1)
        .attr('height', d.y2 - d.y1)
        .attr('rx', 18)
        .attr('ry', 18)
        .attr('fill', '#ffffff')
        .attr('stroke', '#e8e8de')
        .attr('stroke-width', 1);
      // Date header — centered at top of lane
      const cx = (d.x1 + d.x2) / 2;
      sel.append('text')
        .attr('x', cx)
        .attr('y', d.y1 + 32)
        .attr('text-anchor', 'middle')
        .attr('font-size', 16)
        .attr('font-weight', 700)
        .attr('fill', '#2a2a35')
        .text(formatDate(d.date));
      sel.append('text')
        .attr('x', cx)
        .attr('y', d.y1 + 50)
        .attr('text-anchor', 'middle')
        .attr('font-size', 10)
        .attr('font-weight', 500)
        .attr('letter-spacing', '0.10em')
        .attr('fill', '#a8a8b4')
        .attr('font-family', "'SF Mono', 'Fira Code', monospace")
        .text(d.date);
    });

  // ── Edges (curved paths with arrows) ──
  const link = edgeLayer.selectAll('path')
    .data(resolvedEdges)
    .join('path')
    .attr('class', 'link')
    .attr('fill', 'none')
    .attr('stroke', '#c4c4ba')
    .attr('stroke-width', 1.4)
    .attr('stroke-dasharray', d => {
      const t = nodes.find(n => n.id === (typeof d.target === 'object' ? d.target.id : d.target));
      return (t && t.external) ? '3,5' : 'none';
    })
    .attr('marker-end', 'url(#arrow-b8b8b0)');

  // ── Nodes ──
  const node = nodeLayer.selectAll('g')
    .data(nodes)
    .join('g')
    .attr('class', 'node node-clickable');

  // Glow for local nodes
  node.filter(d => !d.external).append('circle')
    .attr('r', 32)
    .attr('fill', d => getTypeStyle(d.type).color)
    .attr('opacity', 0.10);

  // Main circle
  node.append('circle')
    .attr('r', d => d.external ? 10 : 22)
    .attr('fill', d => d.external ? '#ffffff' : '#ffffff')
    .attr('stroke', d => getTypeStyle(d.type).color)
    .attr('stroke-width', d => d.external ? 1.2 : 2);

  // Icon (bigger now)
  node.filter(d => !d.external).append('text')
    .text(d => getTypeStyle(d.type).icon)
    .attr('text-anchor', 'middle')
    .attr('dominant-baseline', 'central')
    .attr('font-size', 14)
    .attr('fill', d => getTypeStyle(d.type).color);

  // Labels
  const MAX_LABEL = 32;
  node.append('text')
    .text(d => {
      let label = d.name;
      if (d.external) {
        const m = label.match(/^(O\d)/);
        if (!m) label = label.substring(0, 22);
      }
      if (label.length > MAX_LABEL) label = label.substring(0, MAX_LABEL - 1) + '…';
      return label;
    })
    .attr('y', d => d.external ? 22 : 38)
    .attr('text-anchor', 'middle')
    .attr('font-size', d => d.external ? 10 : 12)
    .attr('font-weight', d => d.external ? 400 : 600)
    .attr('fill', d => d.external ? '#7a7a88' : '#2a2a35')
    .attr('letter-spacing', '0.01em');

  // Date subtitle for local nodes
  node.filter(d => !d.external && d.date).append('text')
    .text(d => d.date)
    .attr('y', 52)
    .attr('text-anchor', 'middle')
    .attr('font-size', 9)
    .attr('fill', '#a0a0ac')
    .attr('font-family', "'SF Mono', 'Fira Code', monospace");

  // ── Tooltip + Focus on hover ──
  const tooltip = document.getElementById('tooltip');

  function neighborIds(id) {
    const set = new Set([id]);
    for (const e of resolvedEdges) {
      const sid = (e.source.id || e.source);
      const tid = (e.target.id || e.target);
      if (sid === id) set.add(tid);
      if (tid === id) set.add(sid);
    }
    return set;
  }

  node.on('mouseenter', (event, d) => {
    const style = getTypeStyle(d.type);
    tooltip.innerHTML = `
      <div class="tt-name">${d.name}</div>
      <div class="tt-type" style="color:${style.color}">${d.type}${d.date ? '  ·  ' + formatDate(d.date) : ''}</div>
      ${d.description && !d.external ? `<div class="tt-desc">${d.description}</div>` : ''}
      <div class="tt-path">${d.external ? d.id : d.path}</div>
      <div class="tt-hint">${d.external ? 'Click to open in Notion' : 'Click to open file'}</div>
    `;
    tooltip.style.opacity = 1;

    // Focus mode — dim everything not connected to this node
    const neighbors = neighborIds(d.id);
    node.classed('dimmed', n => !neighbors.has(n.id));
    link.classed('dimmed', l => {
      const sid = (l.source.id || l.source);
      const tid = (l.target.id || l.target);
      return sid !== d.id && tid !== d.id;
    });

    // Highlight connected edges
    link.filter(l => {
      const sid = (l.source.id || l.source);
      const tid = (l.target.id || l.target);
      return sid === d.id || tid === d.id;
    })
      .attr('stroke', style.color)
      .attr('stroke-width', 2.2)
      .attr('marker-end', `url(#arrow-${style.color.replace('#','')})`);
  })
  .on('mousemove', (event) => {
    tooltip.style.left = (event.clientX + 14) + 'px';
    tooltip.style.top = (event.clientY - 8) + 'px';
  })
  .on('mouseleave', (event, d) => {
    tooltip.style.opacity = 0;
    node.classed('dimmed', false);
    link.classed('dimmed', false)
      .attr('stroke', '#c4c4ba')
      .attr('stroke-width', 1.4)
      .attr('marker-end', 'url(#arrow-b8b8b0)');
  });

  // ── Side panel ──
  const panel = document.getElementById('panel');
  const panelType = document.getElementById('panel-type');
  const panelName = document.getElementById('panel-name');
  const panelMeta = document.getElementById('panel-meta');
  const panelBody = document.getElementById('panel-body');

  function openPanel(d) {
    const style = getTypeStyle(d.type);
    panelType.textContent = style.label || d.type;
    panelType.style.color = style.color;
    panelType.style.background = style.color + '15';
    panelName.textContent = d.name;
    const metaParts = [];
    if (d.date) metaParts.push(formatDate(d.date));
    if (d.path) metaParts.push(`<span style="font-family:ui-monospace,monospace;color:#9a9aa8">${d.path}</span>`);
    panelMeta.innerHTML = metaParts.join('  ·  ');

    if (d.content && typeof marked !== 'undefined') {
      panelBody.innerHTML = marked.parse(d.content);
    } else if (d.content) {
      panelBody.innerHTML = '<pre style="white-space:pre-wrap;font-family:inherit">' +
        d.content.replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c])) + '</pre>';
    } else {
      panelBody.innerHTML = '<p style="color:#9a9aa8">No content available.</p>';
    }
    panelBody.scrollTop = 0;
    panel.classList.add('open');
    document.getElementById('panel-backdrop').classList.add('open');
  }

  function closePanel() {
    panel.classList.remove('open');
    document.getElementById('panel-backdrop').classList.remove('open');
  }

  document.getElementById('panel-close').addEventListener('click', closePanel);
  document.getElementById('panel-backdrop').addEventListener('click', closePanel);
  document.addEventListener('keydown', e => {
    if (e.key === 'Escape') closePanel();
  });

  node.on('click', (event, d) => {
    event.stopPropagation();
    if (d.external) {
      window.open(d.id, '_blank');
    } else {
      openPanel(d);
    }
  });

  // ── Tick ──
  sim.on('tick', () => {
    // Curved edges
    link.attr('d', d => {
      const dx = d.target.x - d.source.x;
      const dy = d.target.y - d.source.y;
      const dist = Math.sqrt(dx * dx + dy * dy);
      const curve = dist * 0.15;
      return `M${d.source.x},${d.source.y} Q${(d.source.x + d.target.x) / 2 + curve},${(d.source.y + d.target.y) / 2 - curve} ${d.target.x},${d.target.y}`;
    });

    node.attr('transform', d => `translate(${d.x},${d.y})`);
  });
}

init();

</script>
</body>
</html>
