<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Docs Graph</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: #f7f7f4;
    color: #2a2a35;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
    overflow: hidden;
    height: 100vh;
  }

  #header {
    position: fixed;
    top: 0; left: 0; right: 0;
    z-index: 10;
    padding: 20px 28px;
    background: linear-gradient(to bottom, #f7f7f4 70%, transparent);
    pointer-events: none;
    display: flex;
    align-items: baseline;
    gap: 16px;
  }

  #header h1 {
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.12em;
    color: #6a6a78;
    text-transform: uppercase;
    pointer-events: auto;
  }

  #header .stats {
    font-size: 11px;
    color: #9a9aa8;
    pointer-events: auto;
  }

  #legend {
    position: fixed;
    bottom: 24px;
    left: 28px;
    z-index: 10;
    display: flex;
    gap: 16px;
    font-size: 11px;
    color: #6a6a78;
    background: rgba(255,255,255,0.85);
    backdrop-filter: blur(8px);
    padding: 10px 14px;
    border-radius: 10px;
    border: 1px solid #e4e4dc;
  }

  .legend-item {
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .legend-dot {
    width: 9px;
    height: 9px;
    border-radius: 50%;
    flex-shrink: 0;
  }

  #tooltip {
    position: fixed;
    z-index: 20;
    background: #ffffff;
    border: 1px solid #e0e0d8;
    border-radius: 10px;
    padding: 14px 18px;
    max-width: 320px;
    pointer-events: none;
    opacity: 0;
    transition: opacity 0.12s;
    font-size: 13px;
    line-height: 1.5;
    box-shadow: 0 8px 32px rgba(40, 40, 60, 0.12);
  }

  #tooltip .tt-name {
    font-weight: 600;
    font-size: 13px;
    margin-bottom: 3px;
    color: #1a1a25;
  }

  #tooltip .tt-type {
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    margin-bottom: 8px;
    font-weight: 600;
  }

  #tooltip .tt-desc {
    color: #5a5a68;
    font-size: 12px;
    line-height: 1.5;
  }

  #tooltip .tt-path {
    color: #9a9aa8;
    font-size: 10px;
    margin-top: 8px;
    font-family: 'SF Mono', 'Fira Code', 'Consolas', monospace;
  }

  #tooltip .tt-hint {
    color: #b0b0b8;
    font-size: 10px;
    margin-top: 6px;
    font-style: italic;
  }

  svg { display: block; }

  /* Focus mode — applied to <g.node> and <path.link> via classes */
  .dimmed { opacity: 0.12; transition: opacity 0.18s; }
  .focused { opacity: 1; transition: opacity 0.18s; }
  .node-clickable { cursor: pointer; }

  /* ── Side panel ── */
  #panel {
    position: fixed;
    top: 0;
    right: 0;
    bottom: 0;
    width: 70vw;
    max-width: 1100px;
    background: #ffffff;
    border-left: 1px solid #e6e6dc;
    box-shadow: -16px 0 48px rgba(40, 40, 60, 0.06);
    z-index: 30;
    transform: translateX(100%);
    transition: transform 0.28s cubic-bezier(.4, 0, .2, 1);
    display: flex;
    flex-direction: column;
  }
  #panel.open { transform: translateX(0); }
  #panel-backdrop {
    position: fixed; inset: 0; background: rgba(20,20,30,0.18);
    opacity: 0; pointer-events: none; transition: opacity 0.2s; z-index: 29;
  }
  #panel-backdrop.open { opacity: 1; pointer-events: auto; }

  #panel-header {
    padding: 24px 32px 18px;
    border-bottom: 1px solid #f0f0e8;
    flex-shrink: 0;
  }
  #panel-close, #panel-refresh {
    position: absolute;
    top: 18px;
    width: 32px;
    height: 32px;
    border: none;
    background: transparent;
    color: #9a9aa8;
    font-size: 22px;
    cursor: pointer;
    border-radius: 6px;
    line-height: 1;
    transition: background 0.12s;
  }
  #panel-close { right: 22px; }
  #panel-refresh { right: 56px; }
  #panel-close:hover, #panel-refresh:hover { background: #f0f0e8; color: #2a2a35; }

  #panel-type {
    display: inline-block;
    font-size: 10px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    padding: 4px 10px;
    border-radius: 4px;
    margin-bottom: 10px;
  }
  #panel-name {
    font-size: 22px;
    font-weight: 700;
    color: #1a1a25;
    line-height: 1.25;
    margin-bottom: 8px;
    padding-right: 40px;
  }
  #panel-meta {
    font-size: 12px;
    color: #9a9aa8;
    font-family: 'SF Mono', 'Fira Code', monospace;
  }
  #panel-meta a {
    color: #6a6a78;
    text-decoration: none;
    border-bottom: 1px dotted #c4c4ba;
  }
  #panel-meta a:hover { color: #2a2a35; }

  #panel-body {
    padding: 24px 32px 48px;
    overflow-y: auto;
    flex: 1;
    font-size: 14px;
    line-height: 1.65;
    color: #2a2a35;
  }
  #panel-body h1, #panel-body h2, #panel-body h3, #panel-body h4 {
    color: #1a1a25;
    font-weight: 700;
    margin-top: 1.4em;
    margin-bottom: 0.5em;
    line-height: 1.3;
  }
  #panel-body h1 { font-size: 22px; margin-top: 0; }
  #panel-body h2 { font-size: 17px; }
  #panel-body h3 { font-size: 14px; text-transform: uppercase; letter-spacing: 0.04em; color: #5a5a68; }
  #panel-body p { margin-bottom: 0.9em; }
  #panel-body ul, #panel-body ol { margin: 0 0 1em 1.4em; }
  #panel-body li { margin-bottom: 0.3em; }
  #panel-body strong { color: #1a1a25; font-weight: 600; }
  #panel-body em { color: #5a5a68; }
  #panel-body code {
    background: #f4f4ec;
    padding: 1px 6px;
    border-radius: 4px;
    font-size: 12px;
    font-family: 'SF Mono', 'Fira Code', monospace;
  }
  #panel-body pre {
    background: #f4f4ec;
    padding: 14px 18px;
    border-radius: 8px;
    overflow-x: auto;
    margin: 1em 0;
  }
  #panel-body pre code { background: transparent; padding: 0; }
  #panel-body hr { border: none; border-top: 1px solid #f0f0e8; margin: 1.6em 0; }
  #panel-body blockquote {
    border-left: 3px solid #e0e0d8;
    padding-left: 16px;
    color: #5a5a68;
    margin: 1em 0;
  }
  #panel-body a { color: #3F6FD9; text-decoration: none; border-bottom: 1px solid #c8d4f0; }
  #panel-body a:hover { border-bottom-color: #3F6FD9; }

  /* Tables */
  #panel-body table {
    width: 100%;
    border-collapse: collapse;
    margin: 1em 0 1.4em;
    font-size: 13px;
    line-height: 1.5;
  }
  #panel-body thead th {
    text-align: left;
    font-weight: 600;
    color: #1a1a25;
    padding: 8px 12px;
    border-bottom: 2px solid #d8d8ce;
    background: #fafaf6;
    white-space: nowrap;
  }
  #panel-body tbody td {
    padding: 7px 12px;
    border-bottom: 1px solid #eeeeea;
    vertical-align: top;
    color: #2a2a35;
  }
  #panel-body tbody tr:hover { background: #f8f8f4; }
  #panel-body tbody td:first-child { font-weight: 600; white-space: nowrap; }

  /* Checkbox lists (task lists) */
  #panel-body ul li input[type="checkbox"] {
    margin-right: 6px;
    accent-color: #3F6FD9;
  }

  /* Improve readability for long prose */
  #panel-body p, #panel-body li { line-height: 1.65; }
</style>
</head>
<body>

<div id="header">
  <h1>Strategy Graph</h1>
  <span class="stats" id="stats"></span>
</div>

<div id="legend"></div>
<div id="tooltip"></div>

<div id="panel-backdrop"></div>
<aside id="panel">
  <button id="panel-refresh" aria-label="Refresh" title="Reload graph data">↻</button>
  <button id="panel-close" aria-label="Close">×</button>
  <div id="panel-header">
    <div id="panel-type"></div>
    <div id="panel-name"></div>
    <div id="panel-meta"></div>
  </div>
  <div id="panel-body"></div>
</aside>

<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.9.0/d3.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.0/marked.min.js"></script>
<script>

// ── Embedded Graph Data (auto-replaced by build.py) ─────
// __GRAPH_DATA_START__
const GRAPH_DATA = {"projects": {}, "nodes": [], "edges": []};
// __GRAPH_DATA_END__

// ── Config ──────────────────────────────────────────────

const TYPE_STYLES = {
  synthesis:  { color: '#3F6FD9', icon: '◆', label: 'Synthesis' },
  comments:   { color: '#C77E25', icon: '◉', label: 'Comments' },
  note:       { color: '#3F8C5C', icon: '■', label: 'Note' },
  analysis:   { color: '#9050B0', icon: '▲', label: 'Analysis' },
  decision:   { color: '#C73838', icon: '★', label: 'Decision' },
  brief:      { color: '#0E8A8A', icon: '✎', label: 'Brief' },
  draft:      { color: '#7A8B2A', icon: '✦', label: 'Draft' },
  research:   { color: '#E05D44', icon: '⊞', label: 'Research' },
  external:   { color: '#8a8a98', icon: '◇', label: 'External' },  // hidden from graph, used in panel
};

const PROJECT_PALETTES = [
  { bg: '#ffffff', border: '#e6e6dc', label: '#7a7a88' },
];

function getTypeStyle(type) {
  return TYPE_STYLES[type] || TYPE_STYLES.note;
}

// ── Render ───────────────────────────────────────────────

function init() {
  if (!GRAPH_DATA) {
    document.body.innerHTML = `
      <div style="display:flex;align-items:center;justify-content:center;height:100vh;color:#4a4a60;font-size:13px;">
        <div style="text-align:center">
          <p style="font-size:16px;margin-bottom:8px;color:#6a6a80">No graph data</p>
          <p>Run <code style="background:#16161e;padding:3px 10px;border-radius:6px;font-size:12px;">python build.py</code> to generate</p>
        </div>
      </div>`;
    return;
  }

  const { projects, nodes: allNodes, edges } = GRAPH_DATA;
  const width = window.innerWidth;
  const height = window.innerHeight;

  // ── Filter: only render local docs (externals become ref counts) ──
  const nodes = allNodes.filter(n => !n.external);
  const extCount = allNodes.filter(n => n.external).length;

  // Build external ref counts per local node.
  // Local-to-local edges are already visible in the graph; the badge
  // and References panel only surface external refs (Notion pages, URLs).
  const nodeIds = new Set(nodes.map(n => n.id));
  const extRefCount = {};  // how many external refs this doc has
  const extRefsFor = {};   // list of external edge targets per doc
  nodes.forEach(n => { extRefCount[n.id] = 0; extRefsFor[n.id] = []; });
  for (const e of edges) {
    const isExtTarget = !nodeIds.has(e.target);
    if (isExtTarget && extRefCount[e.source] !== undefined) {
      extRefCount[e.source]++;
      extRefsFor[e.source].push(e.target);
    }
  }

  // ── Legend ──
  const legendEl = document.getElementById('legend');
  const usedTypes = new Set(nodes.map(n => n.type));
  for (const [type, style] of Object.entries(TYPE_STYLES)) {
    if (!usedTypes.has(type)) continue;
    const item = document.createElement('div');
    item.className = 'legend-item';
    item.innerHTML = `<div class="legend-dot" style="background:${style.color}"></div><span>${style.label}</span>`;
    legendEl.appendChild(item);
  }

  // ── Resolve edges (local-to-local only) ──
  const resolvedEdges = edges.filter(e => nodeIds.has(e.source) && nodeIds.has(e.target));

  // ── Stats ──
  document.getElementById('stats').textContent =
    `${nodes.length} docs · ${edges.length} references`;

  // ── SVG ──
  const svg = d3.select('body').append('svg').attr('width', width).attr('height', height);

  // Arrow markers — one per type color so arrowheads match edges
  const defs = svg.append('defs');
  const allColors = new Set(['#b8b8b0']); // default
  nodes.forEach(n => allColors.add(getTypeStyle(n.type).color));
  for (const c of allColors) {
    const id = 'arrow-' + c.replace('#', '');
    defs.append('marker')
      .attr('id', id)
      .attr('viewBox', '0 -5 10 10')
      .attr('refX', 24)
      .attr('refY', 0)
      .attr('markerWidth', 7)
      .attr('markerHeight', 7)
      .attr('orient', 'auto')
      .append('path')
      .attr('d', 'M0,-4L10,0L0,4')
      .attr('fill', c);
  }

  const g = svg.append('g');

  // Zoom
  const zoomBehavior = d3.zoom()
    .scaleExtent([0.2, 5])
    .on('zoom', (event) => g.attr('transform', event.transform));
  svg.call(zoomBehavior);

  // ── Horizontal Timeline Layout ──
  // Dates flow LEFT → RIGHT (oldest to newest). Within each date lane,
  // docs that reference each other form vertical chains. Unconnected
  // docs sit side-by-side in separate columns. This keeps linked docs
  // visually grouped while spreading unrelated docs horizontally.
  // Group docs by date — separate research/undated nodes for bottom placement
  const byDate = {};
  const researchNodes = [];
  nodes.forEach(n => {
    if (!n.date || (n.type === 'research' && !n.date)) {
      researchNodes.push(n);
    } else {
      (byDate[n.date] = byDate[n.date] || []).push(n);
    }
  });
  const dates = Object.keys(byDate).sort();

  // Find connected components among locals within a single date.
  // Two docs are connected if there's any edge between them (either direction).
  function findComponents(dateNodes) {
    const idSet = new Set(dateNodes.map(n => n.id));
    const adj = new Map();
    dateNodes.forEach(n => adj.set(n.id, new Set()));

    for (const e of edges) {
      if (idSet.has(e.source) && idSet.has(e.target)) {
        adj.get(e.source).add(e.target);
        adj.get(e.target).add(e.source);
      }
    }

    const visited = new Set();
    const components = [];

    for (const n of dateNodes) {
      if (visited.has(n.id)) continue;
      const comp = [];
      const queue = [n.id];
      while (queue.length) {
        const cur = queue.shift();
        if (visited.has(cur)) continue;
        visited.add(cur);
        comp.push(cur);
        for (const neighbor of adj.get(cur)) {
          if (!visited.has(neighbor)) queue.push(neighbor);
        }
      }
      components.push(comp);
    }
    return components; // array of arrays of node IDs
  }

  // Topological sort within a component: put "root" nodes first
  // (nodes that are referenced by others but don't reference others in the group),
  // then their dependents. Falls back to date-based ordering.
  function orderComponent(compIds, dateNodes) {
    const idSet = new Set(compIds);
    const nodeMap = new Map(dateNodes.map(n => [n.id, n]));

    // Build directed adjacency: source → targets (within component)
    const children = new Map();
    const parentCount = new Map();
    compIds.forEach(id => { children.set(id, []); parentCount.set(id, 0); });

    for (const e of edges) {
      if (idSet.has(e.source) && idSet.has(e.target)) {
        children.get(e.source).push(e.target);
        parentCount.set(e.target, parentCount.get(e.target) + 1);
      }
    }

    // Roots = nodes with no incoming edges from within the component
    const roots = compIds.filter(id => parentCount.get(id) === 0);
    if (roots.length === 0) return compIds.map(id => nodeMap.get(id));

    // BFS from roots to get topological order
    const ordered = [];
    const seen = new Set();
    let frontier = [...roots];
    while (frontier.length) {
      // Sort frontier by name for stability
      frontier.sort((a, b) => (nodeMap.get(a).name || '').localeCompare(nodeMap.get(b).name || ''));
      const next = [];
      for (const id of frontier) {
        if (seen.has(id)) continue;
        seen.add(id);
        ordered.push(nodeMap.get(id));
        for (const child of children.get(id)) {
          if (!seen.has(child)) next.push(child);
        }
      }
      frontier = next;
    }
    // Add any remaining (cycles) at the end
    compIds.forEach(id => { if (!seen.has(id)) ordered.push(nodeMap.get(id)); });
    return ordered;
  }

  // ── Layout constants ──
  const CHAIN_COL_WIDTH = 280;   // horizontal space per chain column
  const CHAIN_COL_GAP = 40;      // gap between chain columns within a lane
  const COL_GAP = 120;           // gap between lanes
  const ROW_SPACING = 140;       // vertical gap between docs in a chain
  const HEADER_HEIGHT = 90;      // space at top of lane for date label
  const LANE_PAD_X = 80;         // horizontal padding inside lane card
  const LANE_PAD_BOT = 100;      // padding below last node

  // ── Place locals into lanes ──
  // For each date, find connected components and lay them out as
  // side-by-side vertical chains.
  const lanes = [];
  let cursorX = 0;

  dates.forEach((date, i) => {
    if (i > 0) {
      cursorX += COL_GAP;
    }

    const dateNodes = byDate[date];
    const components = findComponents(dateNodes);

    // Order components: largest (most connected) first for visual weight
    components.sort((a, b) => b.length - a.length);

    const numCols = components.length;
    const laneWidth = numCols * CHAIN_COL_WIDTH + Math.max(0, numCols - 1) * CHAIN_COL_GAP;

    const lane = {
      date,
      x1: cursorX,
      x2: cursorX + laneWidth,
      topY: 0,
      bottomY: 0,
      locals: [],
    };

    let maxBottom = HEADER_HEIGHT;

    components.forEach((compIds, colIdx) => {
      const ordered = orderComponent(compIds, dateNodes);
      const colCenterX = cursorX + colIdx * (CHAIN_COL_WIDTH + CHAIN_COL_GAP) + CHAIN_COL_WIDTH / 2;

      let yCursor = HEADER_HEIGHT;
      ordered.forEach(n => {
        n.x = colCenterX;
        n.y = yCursor;
        lane.locals.push(n);
        yCursor += ROW_SPACING;
      });
      if (yCursor > maxBottom) maxBottom = yCursor;
    });

    lane.bottomY = maxBottom - ROW_SPACING + LANE_PAD_BOT;
    lanes.push(lane);
    cursorX += laneWidth;
  });

  // Lane card tops are uniform (no external nodes above)
  lanes.forEach(lane => {
    lane.topY = 0;
    lane.cardTop = 0;
  });

  // ── Place research nodes below their parent doc ──
  if (researchNodes.length) {
    const maxLaneBottom = lanes.length ? Math.max(...lanes.map(l => l.bottomY)) : 0;
    const researchY = maxLaneBottom + 100;
    // Build lookup: research node id → parent doc node (via edges)
    const nodeById = new Map(nodes.concat(researchNodes).map(n => [n.id, n]));
    researchNodes.forEach((rn, i) => {
      // Find a parent doc that references this research node
      const parentEdge = edges.find(e => {
        const tid = e.target.id || e.target;
        return tid === rn.id;
      });
      const parentNode = parentEdge ? nodeById.get(parentEdge.source.id || parentEdge.source) : null;
      if (parentNode && parentNode.x != null) {
        rn.x = parentNode.x;
        rn.y = researchY;
      } else {
        // Fallback: center below the timeline
        const totalWidth = cursorX || CHAIN_COL_WIDTH;
        rn.x = totalWidth / 2;
        rn.y = researchY;
      }
    });
  }

  // dayBoxes -> laneBoxes (rendered as vertical lane cards)
  const laneBoxes = lanes.map(lane => ({
    date: lane.date,
    x1: lane.x1 - LANE_PAD_X / 2,
    x2: lane.x2 + LANE_PAD_X / 2,
    y1: lane.cardTop - 30,
    y2: lane.bottomY,
  }));

  // Pin every node so nothing drifts.
  nodes.forEach(n => { n.fx = n.x; n.fy = n.y; });

  // Focus on the 3 most recent date lanes on initial load.
  // User can scroll/zoom to see older lanes.
  const FOCUS_LANES = 3;
  const recentBoxes = laneBoxes.slice(-Math.min(FOCUS_LANES, laneBoxes.length));
  const focMinX = Math.min(...recentBoxes.map(b => b.x1));
  const focMaxX = Math.max(...recentBoxes.map(b => b.x2));
  const focMinY = Math.min(...recentBoxes.map(b => b.y1));
  const focMaxY = Math.max(...recentBoxes.map(b => b.y2));
  const PAD = 60;
  const focW = (focMaxX - focMinX) + PAD * 2;
  const focH = (focMaxY - focMinY) + PAD * 2;
  const scale = Math.min(width / focW, height / focH, 1.2);
  const cx = (focMinX + focMaxX) / 2;
  const cy = (focMinY + focMaxY) / 2;
  const tx = width / 2 - cx * scale;
  const ty = height / 2 - cy * scale;
  svg.call(zoomBehavior.transform, d3.zoomIdentity.translate(tx, ty).scale(scale));

  const sim = d3.forceSimulation(nodes)
    .force('link', d3.forceLink(resolvedEdges).id(d => d.id))
    .alphaDecay(0.2);

  // ── Layers ──
  const dayLayer = g.append('g');
  const edgeLayer = g.append('g');
  const nodeLayer = g.append('g');

  // ── Lane cards (vertical) ──
  // Format date as "Apr 2, 2026"
  function formatDate(iso) {
    if (!iso || !/^\d{4}-\d{2}-\d{2}$/.test(iso)) return iso;
    const [y, m, d] = iso.split('-').map(Number);
    const months = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
    return `${months[m-1]} ${d}, ${y}`;
  }
  function shortDate(iso) {
    if (!iso || !/^\d{4}-\d{2}-\d{2}$/.test(iso)) return iso;
    const [y, m, d] = iso.split('-').map(Number);
    const months = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
    return `${months[m-1]} ${d}`;
  }

  dayLayer.selectAll('g')
    .data(laneBoxes)
    .join('g')
    .each(function(d) {
      const sel = d3.select(this);
      sel.append('rect')
        .attr('x', d.x1)
        .attr('y', d.y1)
        .attr('width', d.x2 - d.x1)
        .attr('height', d.y2 - d.y1)
        .attr('rx', 18)
        .attr('ry', 18)
        .attr('fill', '#ffffff')
        .attr('stroke', '#e8e8de')
        .attr('stroke-width', 1);
      // Date header — centered at top of lane
      const cx = (d.x1 + d.x2) / 2;
      sel.append('text')
        .attr('x', cx)
        .attr('y', d.y1 + 32)
        .attr('text-anchor', 'middle')
        .attr('font-size', 16)
        .attr('font-weight', 700)
        .attr('fill', '#2a2a35')
        .text(formatDate(d.date));
      sel.append('text')
        .attr('x', cx)
        .attr('y', d.y1 + 50)
        .attr('text-anchor', 'middle')
        .attr('font-size', 10)
        .attr('font-weight', 500)
        .attr('letter-spacing', '0.10em')
        .attr('fill', '#a8a8b4')
        .attr('font-family', "'SF Mono', 'Fira Code', monospace")
        .text(d.date);
    });

  // ── Edges (curved paths with arrows) ──
  const link = edgeLayer.selectAll('path')
    .data(resolvedEdges)
    .join('path')
    .attr('class', 'link')
    .attr('fill', 'none')
    .attr('stroke', '#c4c4ba')
    .attr('stroke-width', 1.4)
    .attr('marker-end', 'url(#arrow-b8b8b0)');

  // ── Nodes ──
  const node = nodeLayer.selectAll('g')
    .data(nodes)
    .join('g')
    .attr('class', 'node node-clickable');

  // Glow
  node.filter(d => d.type !== 'research').append('circle')
    .attr('r', 32)
    .attr('fill', d => getTypeStyle(d.type).color)
    .attr('opacity', 0.10);
  node.filter(d => d.type === 'research').append('rect')
    .attr('x', -34).attr('y', -26).attr('width', 68).attr('height', 52)
    .attr('rx', 10).attr('ry', 10)
    .attr('fill', d => getTypeStyle(d.type).color)
    .attr('opacity', 0.10);

  // Main shape — circle for docs, rounded rect for research
  node.filter(d => d.type !== 'research').append('circle')
    .attr('r', 22)
    .attr('fill', '#ffffff')
    .attr('stroke', d => getTypeStyle(d.type).color)
    .attr('stroke-width', 2);
  node.filter(d => d.type === 'research').append('rect')
    .attr('x', -28).attr('y', -20).attr('width', 56).attr('height', 40)
    .attr('rx', 8).attr('ry', 8)
    .attr('fill', '#ffffff')
    .attr('stroke', d => getTypeStyle(d.type).color)
    .attr('stroke-width', 2);

  // Icon
  node.append('text')
    .text(d => getTypeStyle(d.type).icon)
    .attr('text-anchor', 'middle')
    .attr('dominant-baseline', 'central')
    .attr('font-size', 14)
    .attr('fill', d => getTypeStyle(d.type).color);

  // Source count badge — small colored circle with number at top-right
  node.filter(d => extRefCount[d.id] > 0).each(function(d) {
    const count = extRefCount[d.id];
    const r = 10;
    const badge = d3.select(this).append('g')
      .attr('transform', 'translate(18, -18)');
    badge.append('circle')
      .attr('r', r)
      .attr('fill', getTypeStyle(d.type).color);
    badge.append('text')
      .text(count)
      .attr('text-anchor', 'middle')
      .attr('dominant-baseline', 'central')
      .attr('font-size', 10)
      .attr('font-weight', 700)
      .attr('fill', '#ffffff');
  });

  // Labels
  const MAX_LABEL = 32;
  node.append('text')
    .text(d => {
      let label = d.name;
      if (label.length > MAX_LABEL) label = label.substring(0, MAX_LABEL - 1) + '…';
      return label;
    })
    .attr('y', 38)
    .attr('text-anchor', 'middle')
    .attr('font-size', 12)
    .attr('font-weight', 600)
    .attr('fill', '#2a2a35')
    .attr('letter-spacing', '0.01em');

  // Date subtitle
  node.filter(d => d.date).append('text')
    .text(d => d.date)
    .attr('y', 52)
    .attr('text-anchor', 'middle')
    .attr('font-size', 9)
    .attr('fill', '#a0a0ac')
    .attr('font-family', "'SF Mono', 'Fira Code', monospace");

  // ── Tooltip + Focus on hover ──
  const tooltip = document.getElementById('tooltip');

  function neighborIds(id) {
    const set = new Set([id]);
    for (const e of resolvedEdges) {
      const sid = (e.source.id || e.source);
      const tid = (e.target.id || e.target);
      if (sid === id) set.add(tid);
      if (tid === id) set.add(sid);
    }
    return set;
  }

  node.on('mouseenter', (event, d) => {
    const style = getTypeStyle(d.type);
    tooltip.innerHTML = `
      <div class="tt-name">${d.name}</div>
      <div class="tt-type" style="color:${style.color}">${d.type}${d.date ? '  ·  ' + formatDate(d.date) : ''}${extRefCount[d.id] ? '  ·  ' + extRefCount[d.id] + ' source' + (extRefCount[d.id] > 1 ? 's' : '') : ''}</div>
      ${d.description ? `<div class="tt-desc">${d.description}</div>` : ''}
      <div class="tt-path">${d.path}</div>
      <div class="tt-hint">Click to open</div>
    `;
    tooltip.style.opacity = 1;

    // Focus mode — dim everything not connected to this node
    const neighbors = neighborIds(d.id);
    node.classed('dimmed', n => !neighbors.has(n.id));
    link.classed('dimmed', l => {
      const sid = (l.source.id || l.source);
      const tid = (l.target.id || l.target);
      return sid !== d.id && tid !== d.id;
    });

    // Highlight connected edges
    link.filter(l => {
      const sid = (l.source.id || l.source);
      const tid = (l.target.id || l.target);
      return sid === d.id || tid === d.id;
    })
      .attr('stroke', style.color)
      .attr('stroke-width', 2.2)
      .attr('marker-end', `url(#arrow-${style.color.replace('#','')})`);
  })
  .on('mousemove', (event) => {
    tooltip.style.left = (event.clientX + 14) + 'px';
    tooltip.style.top = (event.clientY - 8) + 'px';
  })
  .on('mouseleave', (event, d) => {
    tooltip.style.opacity = 0;
    node.classed('dimmed', false);
    link.classed('dimmed', false)
      .attr('stroke', '#c4c4ba')
      .attr('stroke-width', 1.4)
      .attr('marker-end', 'url(#arrow-b8b8b0)');
  });

  // ── Side panel ──
  const panel = document.getElementById('panel');
  const panelType = document.getElementById('panel-type');
  const panelName = document.getElementById('panel-name');
  const panelMeta = document.getElementById('panel-meta');
  const panelBody = document.getElementById('panel-body');

  function openPanel(d) {
    const style = getTypeStyle(d.type);
    panelType.textContent = style.label || d.type;
    panelType.style.color = style.color;
    panelType.style.background = style.color + '15';
    panelName.textContent = d.name;
    const metaParts = [];
    if (d.date) metaParts.push(formatDate(d.date));
    if (extRefCount[d.id]) metaParts.push(`${extRefCount[d.id]} ref${extRefCount[d.id] > 1 ? 's' : ''}`);
    if (d.path) metaParts.push(`<span style="font-family:ui-monospace,monospace;color:#9a9aa8">${d.path}</span>`);
    panelMeta.innerHTML = metaParts.join('  ·  ');

    let bodyHtml = '';

    // External references section — local edges are already visible in the graph
    const extRefs = (extRefsFor[d.id] || []);
    if (extRefs.length) {
      bodyHtml += '<div style="margin-bottom:20px;padding:14px 16px;background:#f8f8f5;border-radius:10px;">';
      bodyHtml += '<div style="font-size:10px;text-transform:uppercase;letter-spacing:0.08em;color:#9a9aa8;font-weight:600;margin-bottom:8px;">Sources</div>';
      extRefs.forEach(target => {
        const extNode = allNodes.find(n => n.id === target);
        const label = extNode ? extNode.name : target.split('/').pop().substring(0, 40);
        bodyHtml += `<div style="margin:5px 0;"><a href="${target}" target="_blank" style="color:#3F6FD9;text-decoration:none;border-bottom:1px solid #c8d4f0;font-size:13px;">${label}</a><span style="color:#b0b0b8;font-size:10px;margin-left:6px;">↗</span></div>`;
      });
      bodyHtml += '</div>';
    }

    // Document content — strip leading h1 if it duplicates the panel header
    let content = d.content || '';
    // Remove first markdown heading if it matches the doc name
    content = content.replace(/^#\s+.*\n+/, '');

    if (content.trim() && typeof marked !== 'undefined') {
      bodyHtml += marked.parse(content);
    } else if (content.trim()) {
      bodyHtml += '<pre style="white-space:pre-wrap;font-family:inherit">' +
        content.replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c])) + '</pre>';
    } else if (!extRefs.length) {
      bodyHtml += '<p style="color:#9a9aa8">No content available.</p>';
    }

    panelBody.innerHTML = bodyHtml;
    panelBody.scrollTop = 0;
    panel.classList.add('open');
    document.getElementById('panel-backdrop').classList.add('open');
    // Persist open panel in URL hash so refresh keeps it open
    history.replaceState(null, '', '#' + encodeURIComponent(d.id));
  }

  function closePanel() {
    panel.classList.remove('open');
    document.getElementById('panel-backdrop').classList.remove('open');
    history.replaceState(null, '', window.location.pathname);
  }

  document.getElementById('panel-close').addEventListener('click', closePanel);
  document.getElementById('panel-backdrop').addEventListener('click', closePanel);
  document.getElementById('panel-refresh').addEventListener('click', () => {
    window.location.reload();
  });
  document.addEventListener('keydown', e => {
    if (e.key === 'Escape') closePanel();
  });

  // Auto-open panel if URL hash points to a doc (skip animation on restore)
  if (window.location.hash) {
    const hashId = decodeURIComponent(window.location.hash.slice(1));
    const target = nodes.find(n => n.id === hashId);
    if (target) {
      panel.style.transition = 'none';
      document.getElementById('panel-backdrop').style.transition = 'none';
      openPanel(target);
      // Re-enable transitions after paint
      requestAnimationFrame(() => {
        panel.style.transition = '';
        document.getElementById('panel-backdrop').style.transition = '';
      });
    }
  }

  node.on('click', (event, d) => {
    event.stopPropagation();
    openPanel(d);
  });

  // ── Tick ──
  sim.on('tick', () => {
    // Curved edges
    link.attr('d', d => {
      const dx = d.target.x - d.source.x;
      const dy = d.target.y - d.source.y;
      const dist = Math.sqrt(dx * dx + dy * dy);
      const curve = dist * 0.15;
      return `M${d.source.x},${d.source.y} Q${(d.source.x + d.target.x) / 2 + curve},${(d.source.y + d.target.y) / 2 - curve} ${d.target.x},${d.target.y}`;
    });

    node.attr('transform', d => `translate(${d.x},${d.y})`);
  });
}

init();

</script>
</body>
</html>
