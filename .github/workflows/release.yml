name: Build and Release Plugin

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build plugin
        run: |
          zip -r docs-graph.zip . \
            -x ".git/*" ".gitignore" "*.DS_Store" "*.zip" \
            "build.sh" "AGENTS.md" ".github/*"

      - name: Get version
        id: version
        run: echo "version=$(jq -r .version .claude-plugin/plugin.json)" >> $GITHUB_OUTPUT

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: v${{ steps.version.outputs.version }}
          body: |
            docs-graph v${{ steps.version.outputs.version }}

            Download `docs-graph.zip` and upload it in Claude Cowork (Customize → Plugins → Upload).
          files: docs-graph.zip
          make_latest: true
